name: Terra Muta - APK Android di prova

on:
  push:
    paths:
      - 'terra-muta/**'
      - '.github/workflows/terra-muta-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra-muta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run android
      - name: Compila APK di debug
        working-directory: terra-muta/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: terra-muta-debug-apk
          path: terra-muta/android/app/build/outputs/apk/debug/app-debug.apk
