<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Produzione Materie Prime</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/produzione-32.png">
<link rel="apple-touch-icon" href="icons/produzione-180.png">
<link rel="manifest" href="manifest-produzione.json">
<meta name="theme-color" content="#a85a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Produzione">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f6ede1;
    --surface:#fffaf3;
    --surface-2:#f2e6d3;
    --ink:#2b2013;
    --muted:#8a7256;
    --line:#e3d2b0;
    --terra:#a85a2a;
    --terra-ink:#fff6e9;
    --good:#2f4d3c;
    --good-ink:#eaf2ec;
    --bad:#883427;
    --bad-ink:#fbeae6;
    --warn:#a9692a;
    --warn-ink:#2a1c0d;
    --shadow: 0 1px 2px rgba(36,31,22,0.06), 0 1px 1px rgba(36,31,22,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181209;
      --surface:#21180f;
      --surface-2:#2a1f13;
      --ink:#f1e5d2;
      --muted:#b39c7c;
      --line:#3c2d1a;
      --terra:#e08a4f;
      --terra-ink:#20130a;
      --good:#7fae82;
      --good-ink:#10190f;
      --bad:#d97a68;
      --bad-ink:#2c0f0a;
      --warn:#e3a15a;
      --warn-ink:#2a1a08;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181209; --surface:#21180f; --surface-2:#2a1f13; --ink:#f1e5d2; --muted:#b39c7c;
    --line:#3c2d1a; --terra:#e08a4f; --terra-ink:#20130a; --good:#7fae82; --good-ink:#10190f;
    --bad:#d97a68; --bad-ink:#2c0f0a; --warn:#e3a15a; --warn-ink:#2a1a08;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  *{ box-sizing:border-box; touch-action:manipulation; }
  html, body{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y:contain;
  }
  input, textarea, select{ -webkit-user-select:text; user-select:text; }
  .app{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:3rem; }

  header.top{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 18px -14px rgba(20,12,6,.35);
    border-bottom:1px solid var(--line);
    padding:.85rem 1rem .7rem;
  }
  .top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }
  .brand h1{
    margin:0; font-family:'Oswald', sans-serif; font-weight:700; font-size:1.28rem;
    letter-spacing:.02em; text-transform:uppercase; line-height:1.15; color:var(--terra);
  }
  .brand p{ margin:.2rem 0 0; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:'Oswald', sans-serif; }
  .top-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:.4rem; flex:none; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center; width:2.1rem; height:2.1rem;
    border-radius:.5rem; border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    cursor:pointer; transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }
  .top-icons{ display:flex; gap:.35rem; }
  .sync-pill{ display:flex; align-items:center; gap:.4rem; font-size:.68rem; color:var(--muted); white-space:nowrap; padding-top:.25rem; }
  .sync-dot{ width:.5rem; height:.5rem; border-radius:50%; background:var(--muted); flex:none; }
  .sync-dot.synced{ background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .sync-dot.error{ background:var(--bad); }
  .signout-btn{
    display:flex; align-items:center; justify-content:center; width:1.6rem; height:1.6rem; border-radius:.4rem;
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted); cursor:pointer; flex:none;
  }
  .signout-btn svg{ width:12px; height:12px; }
  .signout-btn[hidden]{ display:none; }

  nav.tabs{
    display:flex; gap:.4rem; background:var(--bg); padding:.6rem .75rem 0;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:.25rem; flex:none;
    padding:.5rem .8rem .55rem; border-radius:.65rem; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-family:'Oswald', sans-serif; font-size:.68rem; letter-spacing:.04em;
    text-transform:uppercase; cursor:pointer; min-height:44px; min-width:4.6rem;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn svg{ width:18px; height:18px; }
  .tab-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }

  main.view{ padding:.9rem .75rem 0; }
  .search-wrap{ padding:0 0 .6rem; }
  .search-wrap input{
    width:100%; padding:.6rem .8rem; border-radius:.6rem; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:.9rem;
  }
  .search-wrap input:focus{ outline:2px solid var(--terra); outline-offset:1px; }

  .section-title{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:.95rem; text-transform:uppercase;
    letter-spacing:.03em; color:var(--terra); margin:.2rem 0 .6rem;
  }
  .section-sub{ font-size:.78rem; color:var(--muted); margin:-.4rem 0 .8rem; line-height:1.4; }

  .list{ display:flex; flex-direction:column; gap:.55rem; margin-bottom:1rem; }
  .empty{ text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 1rem; line-height:1.5; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:.75rem;
    padding:.7rem .8rem; box-shadow:var(--shadow);
  }
  .ref-card{ display:flex; gap:.75rem; align-items:flex-start; }
  .ref-main{ flex:1; min-width:0; }
  .ref-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }
  .ref-name{ font-weight:600; font-size:.95rem; line-height:1.25; }
  .ref-badge{
    font-family:'Oswald', sans-serif; font-size:.6rem; text-transform:uppercase; letter-spacing:.04em;
    padding:.12rem .45rem; border-radius:1rem; white-space:nowrap; flex:none;
  }
  .ref-badge.liquido{ background:var(--good); color:var(--good-ink); }
  .ref-badge.solido{ background:var(--warn); color:var(--warn-ink); }
  .ref-stock{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1.05rem; color:var(--terra); margin-top:.3rem; }
  .ref-stock .unit{ font-size:.62rem; font-weight:600; color:var(--muted); margin-left:.15rem; text-transform:uppercase; font-family:'Work Sans', sans-serif; }
  .ref-meta{ font-size:.72rem; color:var(--muted); margin-top:.2rem; }
  .ref-actions{ display:flex; gap:.4rem; margin-top:.55rem; }
  .ref-actions button{
    flex:none; padding:.35rem .6rem; border-radius:.5rem; border:1px solid var(--line);
    background:var(--surface-2); color:var(--muted); font-family:'Oswald', sans-serif; font-size:.65rem;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer; display:flex; align-items:center; gap:.3rem;
  }
  .ref-actions button svg{ width:13px; height:13px; }
  .ref-actions button.expand.open{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }

  .lot-table{ margin-top:.6rem; border-top:1px dashed var(--line); padding-top:.55rem; display:flex; flex-direction:column; gap:.45rem; }
  .lot-row{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    background:var(--surface-2); border-radius:.55rem; padding:.5rem .6rem; font-size:.78rem;
  }
  .lot-row-main{ min-width:0; }
  .lot-num{ font-weight:600; font-family:'IBM Plex Mono', monospace; font-size:.78rem; }
  .lot-detail{ color:var(--muted); font-size:.68rem; margin-top:.1rem; }
  .lot-qty{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:.85rem; text-align:right; white-space:nowrap; }
  .lot-mini-btn{
    flex:none; padding:.3rem .5rem; border-radius:.4rem; border:1px solid var(--line);
    background:var(--surface); color:var(--terra); font-family:'Oswald', sans-serif; font-size:.6rem;
    text-transform:uppercase; cursor:pointer;
  }
  .lot-actions{ display:flex; flex-direction:column; gap:.3rem; flex:none; }

  .ai-warning{
    background:color-mix(in srgb, var(--bad) 12%, var(--surface)); border:1px solid var(--bad);
    color:var(--ink); border-radius:.6rem; padding:.65rem .8rem; font-size:.78rem; line-height:1.5; margin-bottom:.8rem;
  }
  .ai-warning a, .ai-warning button.link-btn{
    color:var(--bad); font-weight:600; text-decoration:underline; background:none; border:none; padding:0;
    cursor:pointer; font-size:inherit; font-family:inherit;
  }
  .file-picker-row{ display:flex; gap:.5rem; flex-wrap:wrap; }
  .file-picker-btn{
    flex:1; min-width:9rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
    padding:1.1rem .6rem; border-radius:.7rem; border:1.5px dashed var(--line); background:var(--surface-2);
    color:var(--muted); cursor:pointer; font-family:'Oswald', sans-serif; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em;
  }
  .file-picker-btn svg{ width:22px; height:22px; color:var(--terra); }
  .file-chosen{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.7rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:.6rem; padding:.55rem .7rem; font-size:.82rem;
  }
  .file-chosen-remove{
    flex:none; width:1.8rem; height:1.8rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .invoice-line{
    background:var(--surface-2); border:1px solid var(--line); border-radius:.7rem; padding:.7rem .75rem;
    display:flex; flex-direction:column; gap:.55rem; margin-bottom:.7rem;
  }
  .invoice-line-top{ display:flex; align-items:flex-start; gap:.5rem; justify-content:space-between; }
  .invoice-line-check{ display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--muted); flex:none; }
  .invoice-line-check input{ width:1.1rem; height:1.1rem; }
  .invoice-raw{
    font-size:.68rem; color:var(--muted); font-style:italic; background:var(--surface); border-radius:.4rem;
    padding:.35rem .5rem; line-height:1.4;
  }

  .thumb{
    flex:none; width:3.6rem; height:3.6rem; border-radius:.6rem; border:1px solid var(--line);
    background:var(--surface-2); color:var(--muted); display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .thumb-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-placeholder{ font-family:'Oswald', sans-serif; font-weight:700; font-size:1.3rem; color:var(--terra); }

  .form-card{ background:var(--surface); border:1px solid var(--line); border-radius:.75rem; padding:.85rem; display:flex; flex-direction:column; gap:.7rem; margin-bottom:1rem; }
  .field label{
    font-family:'Oswald', sans-serif; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); display:block; margin-bottom:.25rem;
  }
  .field{ display:flex; flex-direction:column; }
  .field input, .field select, .field textarea{
    padding:.55rem .7rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); font-family:'Work Sans', sans-serif; font-size:.9rem; width:100%;
  }
  .field textarea{ resize:vertical; min-height:2.4rem; }
  .field select{
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a7256' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right .6rem center; background-size:16px; padding-right:2rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--terra); outline-offset:1px; }
  .field-hint{ font-size:.68rem; color:var(--muted); margin-top:.25rem; }
  .row-split{ display:grid; grid-template-columns:1fr 1fr; gap:.55rem; }
  .row-split3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  .readonly-box{
    padding:.55rem .7rem; border-radius:.5rem; border:1px dashed var(--line); background:var(--surface-2);
    color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:.88rem; font-weight:700;
  }
  .readonly-box .unit{ font-family:'Work Sans', sans-serif; font-weight:500; font-size:.65rem; color:var(--muted); text-transform:uppercase; margin-left:.25rem; }

  .seg{ display:flex; gap:.4rem; }
  .seg-btn{
    flex:1; padding:.55rem .4rem; border-radius:.55rem; border:1px solid var(--line); background:var(--surface-2);
    color:var(--muted); font-family:'Oswald', sans-serif; font-size:.68rem; text-transform:uppercase;
    letter-spacing:.03em; cursor:pointer; transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .seg-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }

  .btn{
    padding:.6rem 1rem; border-radius:.55rem; border:none; font-family:'Oswald', sans-serif; font-size:.74rem;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer; transition:opacity .15s ease;
  }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn-primary{ background:var(--terra); color:var(--terra-ink); }
  .btn-good{ background:var(--good); color:var(--good-ink); }
  .btn-bad{ background:var(--bad); color:var(--bad-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:.5rem; justify-content:flex-end; flex-wrap:wrap; }
  .btn-block{ width:100%; }

  .add-toggle{
    width:100%; padding:.65rem; border-radius:.6rem; border:1px dashed var(--line); background:transparent;
    color:var(--muted); font-family:'Work Sans', sans-serif; font-size:.85rem; font-weight:600; cursor:pointer;
    margin-bottom:.8rem; transition:border-color .15s ease, color .15s ease;
  }
  .add-toggle:hover{ border-color:var(--terra); color:var(--terra); }

  .photo-field{ display:flex; align-items:center; gap:.75rem; }
  .photo-picker{
    flex:none; width:4.6rem; height:4.6rem; padding:0; border-radius:.65rem; border:1.5px dashed var(--line);
    background:var(--surface-2); color:var(--muted); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:.15rem; cursor:pointer; position:relative; overflow:hidden;
  }
  .photo-picker svg{ width:18px; height:18px; }
  .photo-picker-text{ font-size:.55rem; text-transform:uppercase; letter-spacing:.03em; font-family:'Oswald', sans-serif; }
  .photo-preview{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-remove{
    position:absolute; top:.2rem; right:.2rem; width:1.25rem; height:1.25rem; border-radius:50%; border:none;
    background:rgba(20,12,6,.6); color:#fff; font-size:.65rem; line-height:1; cursor:pointer; display:flex;
    align-items:center; justify-content:center;
  }

  .component-row{
    background:var(--surface-2); border:1px solid var(--line); border-radius:.6rem; padding:.55rem .6rem;
    display:flex; flex-direction:column; gap:.45rem;
  }
  .component-row-top{ display:flex; gap:.4rem; align-items:flex-end; }
  .component-row-top .field{ flex:1; min-width:0; }
  .component-del{
    flex:none; width:2.2rem; height:2.2rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .component-del svg{ width:15px; height:15px; }

  .alloc-row{ display:flex; gap:.4rem; align-items:flex-end; }
  .alloc-row .field{ flex:1; min-width:0; }
  .alloc-del{
    flex:none; width:2.2rem; height:2.2rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .alloc-del svg{ width:14px; height:14px; }
  .alloc-summary{ font-size:.72rem; color:var(--muted); }
  .alloc-summary.ok{ color:var(--good); }
  .alloc-summary.warn{ color:var(--bad); }

  .prod-card{ background:var(--surface); border:1px solid var(--line); border-radius:.7rem; padding:.65rem .75rem; box-shadow:var(--shadow); margin-bottom:.6rem; }
  .prod-top{ display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
  .prod-lotto{ font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:.9rem; }
  .prod-date{ font-size:.66rem; color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .prod-meta{ font-size:.75rem; color:var(--muted); margin-top:.25rem; line-height:1.5; }
  .prod-comps{ font-size:.72rem; color:var(--ink); margin-top:.4rem; line-height:1.6; }
  .prod-comps summary{ cursor:pointer; color:var(--terra); font-size:.72rem; font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:.03em; }
  .prod-push-row{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.55rem; }
  .prod-push-status{ font-size:.7rem; color:var(--muted); }

  .move-list{ display:flex; flex-direction:column; gap:.4rem; margin-bottom:1.2rem; }
  .move-row{
    background:var(--surface); border:1px solid var(--line); border-radius:.6rem; padding:.55rem .7rem;
    display:flex; align-items:center; justify-content:space-between; gap:.6rem; box-shadow:var(--shadow);
  }
  .move-main{ display:flex; flex-direction:column; gap:.15rem; min-width:0; }
  .move-name{ font-weight:600; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .move-sub{ font-size:.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-family:'Oswald', sans-serif; }
  .move-causale{ font-size:.7rem; color:var(--ink); font-style:italic; }
  .move-side{ display:flex; flex-direction:column; align-items:flex-end; gap:.15rem; flex:none; }
  .move-delta{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:.9rem; }
  .move-delta.plus{ color:var(--good); }
  .move-delta.minus{ color:var(--bad); }
  .move-time{ font-size:.63rem; color:var(--muted); font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  .move-del{
    flex:none; width:1.8rem; height:1.8rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface-2);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .move-del svg{ width:13px; height:13px; }

  .modal-overlay[hidden]{ display:none; }
  .modal-overlay{ position:fixed; inset:0; z-index:50; background:rgba(20,12,6,.45); display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:560px){ .modal-overlay{ align-items:center; padding:1rem; } }
  .modal-sheet{
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto; background:var(--surface);
    border-radius:1rem 1rem 0 0; padding:1.1rem 1.1rem 1.4rem; box-shadow:0 -4px 24px rgba(20,12,6,.25);
  }
  @media (min-width:560px){ .modal-sheet{ border-radius:1rem; } }
  .modal-title{ font-family:'Oswald', sans-serif; font-weight:700; font-size:1.05rem; margin:0 0 .2rem; }
  .modal-subtitle{ font-size:.8rem; color:var(--muted); margin:0 0 1rem; }
  .modal-hint{ font-size:.74rem; color:var(--muted); margin:-.35rem 0 .7rem; }
  .modal-hint.warn{ color:var(--bad); }

  .auth-gate[hidden]{ display:none; }
  .auth-gate{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .auth-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:1rem; padding:1.7rem 1.4rem 1.5rem; box-shadow:var(--shadow); }
  .auth-title{ font-family:'Oswald', sans-serif; font-weight:700; font-size:1.4rem; text-transform:uppercase; letter-spacing:.02em; margin:0 0 .1rem; color:var(--terra); text-align:center; }

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    initializeFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCZWXqgSjuz23bv684sKZcr3LhopO56cJU",

  };

  var fbApp = initializeApp(firebaseConfig);
  var fs = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true });
  var fbAuth = getAuth(fbApp);

  function pathToRef(path){
    var parts = path.split('/');
    return doc.apply(null, [fs].concat(parts));
  }

  window.__fb = {
    signIn: function(email, password){ return signInWithEmailAndPassword(fbAuth, email, password); },
    signOut: function(){ return signOut(fbAuth); },
    onAuthState: function(cb){ return onAuthStateChanged(fbAuth, cb); },
    getDoc: function(path){
      return getDoc(pathToRef(path)).then(function(snap){ return snap.exists() ? snap.data() : null; });
    },
    setDoc: function(path, data, merge){
      return setDoc(pathToRef(path), data, merge ? { merge: true } : undefined);
    },
    deleteDoc: function(path){ return deleteDoc(pathToRef(path)); },
    getCollection: function(path){
      var ref = collection.apply(null, [fs].concat(path.split('/')));
      return getDocs(ref).then(function(qs){
        var out = [];
        qs.forEach(function(d){ out.push({ id: d.id, data: d.data() }); });
        return out;
      });
    },
    onDocSnapshot: function(path, cb){
      return onSnapshot(pathToRef(path), function(snap){
        cb(snap.exists() ? snap.data() : null);
      }, function(err){ console.error(err); cb(null, err); });
    },
    onCollectionSnapshot: function(path, cb){
      var ref = collection.apply(null, [fs].concat(path.split('/')));
      return onSnapshot(ref, function(qs){
        var out = [];
        qs.forEach(function(d){ out.push({ id: d.id, data: d.data() }); });
        cb(out);
      }, function(err){ console.error(err); cb(null, err); });
    }
  };
  window.dispatchEvent(new Event('fb-ready'));
</script>

  // ---------- utils ----------
  function round(n, d){
    if (n === null || n === undefined || isNaN(n)) return null;

  function numOrNull(v){

  }
  function escapeHtml(s){
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];

  }
  function slugify(s){
    var out = String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return out || 'x';
  }
  function uid(prefix){
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

  function formatDateTime(iso){

  }

  // ---------- data helpers ----------

  function lotById(id){ return state.lots.filter(function(l){ return l.id === id; })[0] || null; }

  function productionById(id){ return state.productions.filter(function(p){ return p.id === id; })[0] || null; }

  function totalStock(refId){
    var lots = lotsForRef(refId);
    var lt = 0, kg = 0, hasLt = false, hasKg = false;
    lots.forEach(function(l){
      if (l.qtyLt !== null && l.qtyLt !== undefined){ lt += l.qtyLt; hasLt = true; }
      if (l.qtyKg !== null && l.qtyKg !== undefined){ kg += l.qtyKg; hasKg = true; }
    });
    return { lt: hasLt ? round(lt,3) : null, kg: hasKg ? round(kg,3) : null };
  }

  function anidriFor(qtyLt, grade){
    if (qtyLt === null || qtyLt === undefined || grade === null || grade === undefined) return null;

  function consumeFromLot(lot, qty, unit){
    var newLt = lot.qtyLt, newKg = lot.qtyKg;

      newLt = round(Math.max(0, (lot.qtyLt || 0) - qty), 3);
      if (lot.density) newKg = round(Math.max(0, (lot.qtyKg || 0) - qty * lot.density), 3);
    } else {
      newKg = round(Math.max(0, (lot.qtyKg || 0) - qty), 3);
      if (lot.density) newLt = round(Math.max(0, (lot.qtyLt || 0) - qty / lot.density), 3);
    }
    return { qtyLt: newLt, qtyKg: newKg };

      document.getElementById('toastRetryBtn').addEventListener('click', function(){ hideToast(); retryFn(); });

  // ---------- photo compression ----------
  function readAndCompressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          try { resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY)); } catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Re-rendering replaces the focused input's DOM node, which drops focus
  // and closes the on-screen keyboard on mobile mid-typing. This re-applies
  // focus (and cursor position) to the equivalent element after a render.
  function focusLocator(el){
    if (!el || el === document.body) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    var dataAttrs = Array.prototype.filter.call(el.attributes || [], function(a){ return a.name.indexOf('data-') === 0; });
    if (!dataAttrs.length) return null;
    return el.tagName.toLowerCase() + dataAttrs.map(function(a){ return '[' + a.name + '="' + a.value.replace(/"/g,'\\"') + '"]'; }).join('');
  }
  function withFocusPreserved(fn){
    var active = document.activeElement;
    var locator = focusLocator(active);
    var selStart, selEnd;
    if (active && typeof active.selectionStart === 'number'){
      try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
    }
    fn();
    if (!locator) return;
    var el;
    try { el = document.querySelector(locator); } catch(e){ el = null; }
    if (!el) return;
    el.focus();
    if (selStart !== undefined && typeof el.setSelectionRange === 'function'){
      try { el.setSelectionRange(selStart, selEnd); } catch(e){}
    }
  }

  function renderTabs(){

      return '<button type="button" class="tab-btn' + (state.view === t.id ? ' active' : '') + '" data-action="tab" data-tab="' + t.id + '">' + t.icon + '<span>' + t.label + '</span></button>';
    }).join('');

  function renderView(){

    if (state.view === 'materie') html = renderMaterieView();

    else if (state.view === 'produzione') html = renderProduzioneView();
    else if (state.view === 'ricette') html = renderRicetteView();
    else if (state.view === 'storico') html = renderStoricoView();

      html += '<p class="empty">Nessuna referenza trovata.<br>Aggiungine una per iniziare a registrare i carichi.</p>';
    } else {
      html += '<div class="list">';
      refs.forEach(function(r){
        var tot = totalStock(r.id);
        var lots = lotsForRef(r.id).filter(function(l){ return (l.qtyLt||0) > 0.0005 || (l.qtyKg||0) > 0.0005; });

        html += '</div>';
        if (isOpen && lots.length){
          html += '<div class="lot-table">';
          lots.forEach(function(l){
            html += '<div class="lot-row">';

            var det = [];
            if (l.density !== null && l.density !== undefined) det.push('densità ' + fmt(l.density,3));
            if (l.grade !== null && l.grade !== undefined) det.push('grad. ' + fmt(l.grade,1) + '%');
            if (det.length) html += '<div class="lot-detail">' + det.join(' · ') + '</div>';
            html += '</div>';
            var qtyParts = [];
            if (l.qtyLt !== null && l.qtyLt !== undefined) qtyParts.push(fmt(l.qtyLt,3) + ' Lt');

            html += '</div>';

  function renderProdComponents(){
    var d = state.produzione;
    var recipe = d.recipeId ? recipeById(d.recipeId) : null;
    var qty = numOrNull(d.quantity);
    var html = '';
    d.components.forEach(function(c, idx){
      var ref = referenceById(c.refId);
      if (!ref && recipe) return;
      html += '<div class="component-row" data-comp-idx="' + idx + '">';
      html += '<div class="component-row-top">';
      if (!recipe){
        html += '<div class="field"><label>Referenza</label><select data-comp-field="refId" data-comp-idx="' + idx + '">';
        html += '<option value="">— Seleziona —</option>';
        state.references.slice().sort(function(a,b){return a.name.localeCompare(b.name,'it');}).forEach(function(r){
          html += '<option value="' + r.id + '"' + (r.id===c.refId?' selected':'') + '>' + escapeHtml(r.name) + '</option>';
        });
        html += '</select></div>';
        html += '<button type="button" class="component-del" data-action="prod-remove-component" data-idx="' + idx + '">' + iconTrash() + '</button>';
      }
      html += '</div>';

      if (ref){
        var required = null;
        if (recipe){
          var factor = (qty && recipe.baseLt) ? (qty / recipe.baseLt) : null;
          required = factor !== null ? round((ref.unit==='liquido' ? c.doseLt : c.doseKg) * factor, 3) : null;
        }
        var unitLabel = ref.unit === 'liquido' ? 'Lt' : 'Kg';
        if (recipe){
          html += '<div class="field-hint">' + escapeHtml(ref.name) + (required!==null? ' — richiesti ' + fmt(required,3) + ' ' + unitLabel : '') + '</div>';
        }
        html += renderAllocations(c, ref, required, idx);
      }
      html += '</div>';
    });
    return html;
  }

  function renderAllocations(c, ref, required, compIdx){
    var lots = lotsForRef(ref.id).filter(function(l){ return (ref.unit==='liquido'? (l.qtyLt||0) : (l.qtyKg||0)) > 0.0005; });
    var html = '<div class="alloc-list">';
    var total = 0;
    c.allocations.forEach(function(a, aIdx){
      total += numOrNull(a.qty) || 0;
      html += '<div class="alloc-row">';
      html += '<div class="field"><label>Lotto</label><select data-alloc-field="lotId" data-comp-idx="' + compIdx + '" data-alloc-idx="' + aIdx + '">';
      html += '<option value="">— Seleziona lotto —</option>';
      lots.forEach(function(l){
        var av = ref.unit==='liquido' ? l.qtyLt : l.qtyKg;
        html += '<option value="' + l.id + '"' + (l.id===a.lotId?' selected':'') + '>Lotto ' + escapeHtml(l.lotto) + ' — disp. ' + fmt(av,3) + '</option>';
      });
      html += '</select></div>';
      html += '<div class="field"><label>Quantità (' + (ref.unit==='liquido'?'Lt':'Kg') + ')</label><input type="number" step="0.001" min="0" value="' + escapeHtml(a.qty) + '" data-alloc-field="qty" data-comp-idx="' + compIdx + '" data-alloc-idx="' + aIdx + '"></div>';
      html += '<button type="button" class="alloc-del" data-action="prod-remove-alloc" data-comp-idx="' + compIdx + '" data-alloc-idx="' + aIdx + '">' + iconTrash() + '</button>';
      html += '</div>';
    });
    html += '<button type="button" class="add-toggle" style="margin-bottom:0;" data-action="prod-add-alloc" data-comp-idx="' + compIdx + '">+ Aggiungi lotto</button>';
    if (required !== null){
      var diff = round(required - total, 3);
      var cls = Math.abs(diff) < 0.001 ? 'ok' : 'warn';
      html += '<div class="alloc-summary ' + cls + '">Allocati: ' + fmt(total,3) + ' / ' + fmt(required,3) + (Math.abs(diff)>=0.001 ? (diff>0? ' (mancano '+fmt(diff,3)+')' : ' (in eccesso di '+fmt(-diff,3)+')') : ' ✓') + '</div>';
    } else if (total > 0) {
      html += '<div class="alloc-summary">Allocati: ' + fmt(total,3) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function computeProdCalc(){
    var d = state.produzione;
    var qty = numOrNull(d.quantity);
    var anidri = 0; var hasAny = false;
    d.components.forEach(function(c){
      var ref = referenceById(c.refId);
      if (!ref || ref.unit !== 'liquido') return;
      c.allocations.forEach(function(a){
        var lot = lotById(a.lotId);
        var q = numOrNull(a.qty);
        if (!lot || q === null) return;
        if (lot.grade !== null && lot.grade !== undefined){
          anidri += q * lot.grade / 100;
          hasAny = true;
        }
      });
    });
    anidri = hasAny ? round(anidri, 3) : null;
    var gradeTheoretical = (anidri !== null && qty) ? round(anidri / qty * 100, 2) : null;
    return { anidri: anidri, gradeTheoretical: gradeTheoretical };
  }

  function renderProductionsHistory(){
    var list = state.productions.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).slice(0, 25);
    if (!list.length) return '';
    var html = '<div class="section-title" style="margin-top:1.2rem;">Produzioni registrate</div>';
    list.forEach(function(p){
      var pushed = (p.pushes||[]).reduce(function(s,x){ return s + (x.qty||0); }, 0);
      var remaining = round(Math.max(0, (p.quantityLt||0) - pushed), 3);
      html += '<div class="prod-card">';
      html += '<div class="prod-top"><span class="prod-lotto">Lotto ' + escapeHtml(p.finishedLotto) + '</span><span class="prod-date">' + (p.createdAt?formatDateTime(p.createdAt):'') + '</span></div>';
      html += '<div class="prod-meta">' + (p.recipeName? escapeHtml(p.recipeName)+' · ' : 'Produzione libera · ') + fmt(p.quantityLt,2) + ' Lt';
      if (p.gradeTheoretical!==null && p.gradeTheoretical!==undefined) html += ' · grad. teorica ' + fmt(p.gradeTheoretical,2) + '%';
      if (p.gradeEffective!==null && p.gradeEffective!==undefined) html += ' · grad. effettiva ' + fmt(p.gradeEffective,2) + '%';
      html += '</div>';
      if (p.components && p.components.length){
        html += '<details class="prod-comps"><summary>Componenti usati</summary><div style="margin-top:.3rem;">';
        p.components.forEach(function(c){
          html += escapeHtml(c.refName) + ' — lotto ' + escapeHtml(c.lotto) + ': ' + fmt(c.qty,3) + ' ' + (c.unit==='lt'?'Lt':'Kg') + '<br>';
        });
        html += '</div></details>';
      }
      html += '<div class="prod-push-row">';
      if (remaining > 0.0005){
        html += '<span class="prod-push-status">Da caricare: ' + fmt(remaining,2) + ' Lt</span>';
        html += '<button type="button" class="btn btn-primary" data-action="open-push" data-id="' + p.id + '">Carica in Giacenze Liquori</button>';
      } else {
        html += '<span class="prod-push-status">✓ Tutto caricato in Giacenze Liquori</span>';
      }
      html += '</div>';
      html += '</div>';
    });
    return html;
  }

  // ==================================================================
  function renderRicetteView(){
    var html = '';
    html += '<div class="section-title">Ricette</div>';
    html += '<div class="section-sub">Definisci la ricetta per un certo numero di litri di riferimento: in produzione le dosi si moltiplicano automaticamente.</div>';

    if (!state.ricette.formOpen){
      html += '<button type="button" class="add-toggle" data-action="new-recipe">+ Nuova ricetta</button>';
    } else {
      html += renderRecipeForm();
    }

    var recipes = state.recipes.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'it'); });
    if (!recipes.length && !state.ricette.formOpen){
      html += '<p class="empty">Nessuna ricetta salvata.</p>';
    } else if (recipes.length) {
      html += '<div class="list">';
      recipes.forEach(function(r){
        var calc = recipeCalc(r);
        html += '<div class="card">';
        html += '<div class="ref-top"><span class="ref-name">' + escapeHtml(r.name) + '</span></div>';
        html += '<div class="ref-meta">Per ' + fmt(r.baseLt,2) + ' Lt · ' + (r.components||[]).length + ' componenti</div>';
        html += '<div class="ref-meta">Litri anidri: ' + (calc.anidri===null?'—':fmt(calc.anidri,3)) + ' Lt · Gradazione teorica: ' + (calc.gradeTheoretical===null?'—':fmt(calc.gradeTheoretical,2)) + '%</div>';
        html += '<div class="ref-actions">';
        html += '<button type="button" data-action="edit-recipe" data-id="' + r.id + '">' + iconEdit() + ' Modifica</button>';
        html += '<button type="button" data-action="delete-recipe" data-id="' + r.id + '">' + iconTrash() + ' Elimina</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    return html;
  }

  function recipeCalc(r){
    var anidri = 0, hasAny = false;
    (r.components||[]).forEach(function(c){
      var ref = referenceById(c.refId);
      if (!ref || ref.unit !== 'liquido' || ref.grade === null || ref.grade === undefined) return;
      if (c.doseLt === null || c.doseLt === undefined) return;
      anidri += c.doseLt * ref.grade / 100;
      hasAny = true;
    });
    anidri = hasAny ? round(anidri,3) : null;
    var gradeTheoretical = (anidri !== null && r.baseLt) ? round(anidri / r.baseLt * 100, 2) : null;
    return { anidri: anidri, gradeTheoretical: gradeTheoretical };
  }

  function renderRecipeForm(){
    var d = state.ricette.draft;
    var html = '<div class="form-card">';

    html += fieldInput('recipeBaseLt', 'Litri di riferimento', 'number', d.baseLt, 'step="0.01" min="0.01"');

    html += '<div id="recipeComponentsWrap">';
    d.components.forEach(function(c, idx){
      var ref = c.refId ? referenceById(c.refId) : null;
      html += '<div class="component-row">';

  // Same reasoning as handleCaricoBlurAutoDensity: only derive density from
  // Lt+Kg once the user finishes editing one of the two fields, not on every
  // keystroke, or a half-typed number locks in the wrong value.
  function handleLotModalBlurAutoDensity(){
    var d = state.lotModal.draft;
    var lt = document.getElementById('lotQtyLt');
    var kg = document.getElementById('lotQtyKg');
    var dens = document.getElementById('lotDensity');
    if (!lt || !kg || !dens) return;
    if (numOrNull(dens.value) !== null) return;
    var ltVal = numOrNull(lt.value);
    var kgVal = numOrNull(kg.value);
    if (ltVal !== null && ltVal > 0 && kgVal !== null){
      var computed = round(kgVal / ltVal, 4);
      dens.value = computed;
      d.density = computed;
    }
  }

  function saveLotEdit(){
    var m = state.lotModal;
    var lot = lotById(m.lotId);
    if (!lot) return;
    var ref = referenceById(lot.refId);
    var newQtyLt = numOrNull(document.getElementById('lotQtyLt').value);
    var newQtyKg = numOrNull(document.getElementById('lotQtyKg').value);
    var newDensity = numOrNull(document.getElementById('lotDensity').value);
    var gradeInput = document.getElementById('lotGrade');
    var newGrade = gradeInput ? numOrNull(gradeInput.value) : (lot.grade === undefined ? null : lot.grade);

    var oldPrimary = ref && ref.unit === 'liquido' ? (lot.qtyLt || 0) : (lot.qtyKg || 0);
    var patch = {
      qtyLt: newQtyLt === null ? null : round(newQtyLt, 3),
      qtyKg: newQtyKg === null ? null : round(newQtyKg, 3),
      density: newDensity,
      grade: newGrade
    };
    var newPrimary = ref && ref.unit === 'liquido' ? (patch.qtyLt || 0) : (patch.qtyKg || 0);
    var delta = round(newPrimary - oldPrimary, 3);

    window.__fb.setDoc(LOTS_COLL + '/' + lot.id, patch, true).then(function(){
      Object.keys(patch).forEach(function(k){ lot[k] = patch[k]; });
      if (delta !== 0){
        logProdMovement({
          type:'correzione', refId: lot.refId, refName: lot.refName, lotto: lot.lotto,
          unit: ref && ref.unit === 'liquido' ? 'lt' : 'kg',
          delta: delta,
          causale: 'Correzione manuale giacenza'
        });
      }
      showToast('Giacenza aggiornata.');
      closeLotModal();
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Salvataggio non riuscito. Riprova.', saveLotEdit);
    });
  }

  // ==================================================================
  // ACTIONS: references
  // ==================================================================
  function saveReference(){
    var m = state.refModal;
    var d = m.draft;
    var name = document.getElementById('refName').value.trim();
    if (!name){ showToast('Inserisci il nome della referenza.'); return; }
    var unit = d.unit;
    var codice = document.getElementById('refCodice').value.trim();
    var density = numOrNull(document.getElementById('refDensity').value);
    var grade = unit === 'liquido' ? numOrNull(document.getElementById('refGrade').value) : null;
    var notes = document.getElementById('refNotes').value.trim();
    var id = d.id || uid('ref');
    var wasEdit = m.mode === 'edit';
    var docData = { name: name, unit: unit, codice: codice || null, density: density, grade: grade, photo: d.photo || null, notes: notes || null };
    window.__fb.setDoc(REFS_COLL + '/' + id, docData).then(function(){
      // Apply locally right away instead of waiting for the Firestore listener
      // to echo it back — otherwise switching straight back to Carico can
      // momentarily find no matching reference yet.
      var idx = -1;
      for (var i = 0; i < state.references.length; i++){ if (state.references[i].id === id){ idx = i; break; } }
      var refObj = { id: id, name: docData.name, unit: docData.unit, codice: docData.codice, density: docData.density, grade: docData.grade, photo: docData.photo, notes: docData.notes };
      if (idx === -1) state.references.push(refObj); else state.references[idx] = refObj;
      var backfill = (wasEdit && density !== null) ? backfillLotsDensity(id, density) : Promise.resolve();
      return backfill;
    }).then(function(){
      showToast(wasEdit ? 'Referenza aggiornata.' : 'Referenza creata.');
      var returnTo = m.returnTo;
      closeRefModal();
      if (returnTo === 'carico'){
        state.carico = freshCaricoDraft();
        state.carico.refId = id;
        state.carico.density = density === null ? '' : density;
        state.carico.grade = grade === null ? '' : grade;
        render();
      }
    }).catch(function(e){
      console.error(e);
      showToast('Salvataggio non riuscito. Riprova.');
    });
  }

  // When a reference gets a density it didn't have before, lots created while
  // it was still unknown are stuck showing only one unit (e.g. just Kg, no
  // Lt). Backfill the missing side for those lots now that density is known
  // — but only lots with no density of their own, never one entered for a
  // specific batch.
  function backfillLotsDensity(refId, density){
    // A now-fixed earlier bug stored qtyLt as 0 (instead of leaving it empty)
    // on liquid lots carico'd with Kg only, so an exact 0 is treated the same
    // as "never recorded" here — never a real, intentionally-tracked zero.
    var toFix = lotsForRef(refId).filter(function(l){ return l.density === null || l.density === undefined; });
    if (!toFix.length) return Promise.resolve();
    return Promise.all(toFix.map(function(l){
      var patch = { density: density };
      if (l.qtyKg && !l.qtyLt){
        patch.qtyLt = round(l.qtyKg / density, 3);
      } else if (l.qtyLt && !l.qtyKg){
        patch.qtyKg = round(l.qtyLt * density, 3);
      }
      Object.keys(patch).forEach(function(k){ l[k] = patch[k]; }); // reflect locally without waiting on the listener
      return window.__fb.setDoc(LOTS_COLL + '/' + l.id, patch, true);
    }));
  }

  function deleteReference(id){
    var lots = lotsForRef(id).filter(function(l){ return (l.qtyLt||0) > 0.0005 || (l.qtyKg||0) > 0.0005; });
    if (lots.length){
      showToast('Impossibile eliminare: ci sono ancora giacenze su ' + lots.length + ' lotto/i.');
      return;
    }
    openConfirm('Eliminare referenza?', 'La referenza verrà rimossa definitivamente.', function(){
      window.__fb.deleteDoc(REFS_COLL + '/' + id).then(function(){
        showToast('Referenza eliminata.');
        closeRefModal();
      }).catch(function(e){ console.error(e); showToast('Eliminazione non riuscita.'); });
    });
  }

    var kg = document.getElementById('caricoKg');
    var dens = document.getElementById('caricoDensity');
    var density = numOrNull(dens.value);
    if (target.id === 'caricoLt'){
      d.qtyLt = lt.value;
      var ltVal = numOrNull(lt.value);
      if (density !== null && ltVal !== null){ var k = round(ltVal * density, 3); kg.value = k; d.qtyKg = k; }
    } else if (target.id === 'caricoKg'){
      d.qtyKg = kg.value;
      var kgVal = numOrNull(kg.value);
      if (density !== null && kgVal !== null){ var l = round(kgVal / density, 3); lt.value = l; d.qtyLt = l; }
    } else if (target.id === 'caricoDensity'){
      d.density = dens.value;
      var ltVal3 = numOrNull(lt.value);
      var kgVal3 = numOrNull(kg.value);
      if (density !== null && ltVal3 !== null){ var k2 = round(ltVal3 * density, 3); kg.value = k2; d.qtyKg = k2; }
      else if (density !== null && kgVal3 !== null){ var l2 = round(kgVal3 / density, 3); lt.value = l2; d.qtyLt = l2; }
    }
    // update anidri readonly box live (only present for materie liquide)
    var box = document.querySelector('#caricoForm .readonly-box');

      var anidri = anidriFor(numOrNull(d.qtyLt), numOrNull(d.grade));

  }

  // Runs once a user finishes editing Lt or Kg (blur/change, not every keystroke):
  // if density is still unknown and both quantities are now filled in, derive it.
  // Deriving it live on every keystroke would lock in a wrong value from a
  // half-typed number (e.g. "9" before the user finishes typing "9.4") and
  // then start overwriting whichever field the user is still editing.
  function handleCaricoBlurAutoDensity(){
    var d = state.carico;
    var lt = document.getElementById('caricoLt');
    var kg = document.getElementById('caricoKg');
    var dens = document.getElementById('caricoDensity');
    if (!lt || !kg || !dens) return;
    if (numOrNull(dens.value) !== null) return;
    var ltVal = numOrNull(lt.value);
    var kgVal = numOrNull(kg.value);
    if (ltVal !== null && ltVal > 0 && kgVal !== null){
      var computed = round(kgVal / ltVal, 4);
      dens.value = computed;
      d.density = computed;
      if (d.grade !== '' && d.grade !== null && d.grade !== undefined){
        var box = document.querySelector('#caricoForm .readonly-box');
        if (box){
          var anidri = anidriFor(ltVal, numOrNull(d.grade));
          box.innerHTML = (anidri===null?'—':fmt(anidri,3)) + '<span class="unit">Lt</span>';
        }
      }
    }
  }

  // Shared by the manual Carico form and the invoice-import flow: upserts a
  // lot's stock (adding to whatever is already there) and logs the movement.
  // Keeps state.lots in sync locally so a batch of several commits in a row
  // (e.g. multiple invoice lines for the same lot) sums correctly without
  // waiting for Firestore's listener to echo each write back.
  function commitCarico(ref, lotto, qtyLt, qtyKg, density, grade, causale){
    var lotId = lotDocId(ref.id, lotto);
    var existing = lotById(lotId);
    var newQtyLt = (existing ? (existing.qtyLt||0) : 0) + (qtyLt || 0);
    var newQtyKg = (existing ? (existing.qtyKg||0) : 0) + (qtyKg || 0);
    var hasLt = qtyLt !== null || (existing && existing.qtyLt !== null && existing.qtyLt !== undefined);
    var docData = {
      refId: ref.id, refName: ref.name, lotto: lotto, unit: ref.unit,
      density: density !== null ? density : (existing ? existing.density : null),
      grade: grade !== null ? grade : (existing ? existing.grade : null),
      qtyLt: hasLt ? round(newQtyLt,3) : null,
      qtyKg: round(newQtyKg,3),
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    return window.__fb.setDoc(LOTS_COLL + '/' + lotId, docData).then(function(){
      if (existing){ Object.keys(docData).forEach(function(k){ existing[k] = docData[k]; }); }
      else { state.lots.push(Object.assign({ id: lotId }, docData)); }
      logProdMovement({
        type:'carico', refId: ref.id, refName: ref.name, lotto: lotto,
        unit: ref.unit === 'liquido' ? 'lt' : 'kg',
        delta: ref.unit === 'liquido' ? (qtyLt || 0) : (qtyKg || 0),
        causale: causale || null
      });
    });
  }

  function saveCarico(){
    var d = state.carico;
    var ref = referenceById(d.refId);
    if (!ref) return;
    var lotto = document.getElementById('caricoLotto').value.trim();
    if (!lotto){ showToast('Inserisci il numero di lotto.'); return; }
    var qtyLt = numOrNull(document.getElementById('caricoLt').value);
    var qtyKg = numOrNull(document.getElementById('caricoKg').value);
    var density = numOrNull(document.getElementById('caricoDensity').value);
    var grade = ref.unit === 'liquido' ? numOrNull(document.getElementById('caricoGrade').value) : null;

    if ((!qtyLt || qtyLt <= 0) && (!qtyKg || qtyKg <= 0)){
      showToast('Inserisci una quantità maggiore di zero.');
      return;
    }

    commitCarico(ref, lotto, qtyLt, qtyKg, density, grade, causale).then(function(){
      showToast('Carico registrato: lotto ' + lotto + '.');
      state.carico = freshCaricoDraft();

  function saveScarico(){
    var d = state.scarico;
    var ref = referenceById(d.refId);
    var lot = lotById(d.lotId);
    if (!ref || !lot) return;
    var qtyLt = numOrNull(document.getElementById('scaricoLt') ? document.getElementById('scaricoLt').value : null);
    var qtyKg = numOrNull(document.getElementById('scaricoKg').value);
    var causale = document.getElementById('scaricoCausale').value.trim();

    var unit, qty;
    if (qtyLt && qtyLt > 0){ unit = 'lt'; qty = qtyLt; }
    else if (qtyKg && qtyKg > 0){ unit = 'kg'; qty = qtyKg; }
    else { showToast('Inserisci una quantità maggiore di zero.'); return; }

    var avail = availableQty(lot, unit);
    if (qty > avail + 0.0005){
      showToast('Disponibili solo ' + fmt(avail,3) + ' ' + (unit==='lt'?'Lt':'Kg') + '.');
      return;

    var updated = consumeFromLot(lot, qty, unit);
    window.__fb.setDoc(LOTS_COLL + '/' + lot.id, { qtyLt: updated.qtyLt, qtyKg: updated.qtyKg, updatedAt: new Date().toISOString() }, true).then(function(){
      logProdMovement({ type:'scarico', refId: ref.id, refName: ref.name, lotto: lot.lotto, unit: unit, delta: -qty, causale: causale || null });
      showToast('Scarico registrato: -' + fmt(qty,3) + ' ' + (unit==='lt'?'Lt':'Kg') + '.');
      state.scarico = freshScaricoDraft();
      render();
    }).catch(function(e){

      showToast('Salvataggio non riuscito. Riprova.', saveScarico);
    });
  }

  function saveProduzione(){
    var d = state.produzione;
    var quantity = numOrNull(d.quantity);
    var finishedLotto = document.getElementById('prodLotto').value.trim();
    var gradeEffective = numOrNull(document.getElementById('prodGradeEff').value);
    var note = document.getElementById('prodNote').value.trim();

    if (!finishedLotto){ showToast('Inserisci il lotto del prodotto finito.'); return; }
    if (!quantity || quantity <= 0){ showToast('Inserisci una quantità da produrre valida.'); return; }
    if (!d.components.length){ showToast('Aggiungi almeno un componente.'); return; }

    var consumptions = []; // { lot, qty, unit }
    var componentsSnapshot = [];
    for (var i = 0; i < d.components.length; i++){
      var c = d.components[i];
      var ref = referenceById(c.refId);
      if (!ref){ showToast('Seleziona una referenza per ogni componente.'); return; }
      var unit = ref.unit === 'liquido' ? 'lt' : 'kg';
      for (var j = 0; j < c.allocations.length; j++){
        var a = c.allocations[j];
        var q = numOrNull(a.qty);
        if (!a.lotId || !q || q <= 0) continue;
        var lot = lotById(a.lotId);
        if (!lot){ showToast('Lotto non valido per ' + ref.name + '.'); return; }
        var avail = availableQty(lot, unit);
        if (q > avail + 0.0005){
          showToast('Disponibili solo ' + fmt(avail,3) + ' ' + (unit==='lt'?'Lt':'Kg') + ' per il lotto ' + lot.lotto + ' di ' + ref.name + '.');
          return;
        }
        consumptions.push({ lot: lot, qty: q, unit: unit, refName: ref.name });
      }
    }
    if (!consumptions.length){ showToast('Alloca almeno una quantità da un lotto per ogni componente.'); return; }

    var calc = computeProdCalc();
    var productionId = uid('prod');

    // apply consumptions sequentially
    var chain = Promise.resolve();
    consumptions.forEach(function(cons){
      chain = chain.then(function(){
        var updated = consumeFromLot(cons.lot, cons.qty, cons.unit);
        cons.lot.qtyLt = updated.qtyLt;
        cons.lot.qtyKg = updated.qtyKg;
        return window.__fb.setDoc(LOTS_COLL + '/' + cons.lot.id, { qtyLt: updated.qtyLt, qtyKg: updated.qtyKg, updatedAt: new Date().toISOString() }, true).then(function(){
          logProdMovement({ type:'scarico_produzione', refId: cons.lot.refId, refName: cons.refName, lotto: cons.lot.lotto, unit: cons.unit, delta: -cons.qty, causale: 'Produzione lotto ' + finishedLotto });
          componentsSnapshot.push({ refId: cons.lot.refId, refName: cons.refName, lotto: cons.lot.lotto, qty: cons.qty, unit: cons.unit });
        });
      });
    });

    chain.then(function(){
      var recipe = d.recipeId ? recipeById(d.recipeId) : null;
      var prodDoc = {
        recipeId: d.recipeId || null,
        recipeName: recipe ? recipe.name : null,
        quantityLt: quantity,
        finishedLotto: finishedLotto,
        gradeTheoretical: calc.gradeTheoretical,
        gradeEffective: gradeEffective,
        anhydrousLt: calc.anidri,
        components: componentsSnapshot,
        note: note || null,
        createdAt: new Date().toISOString(),
        pushes: []
      };
      return window.__fb.setDoc(PRODUCTIONS_COLL + '/' + productionId, prodDoc);
    }).then(function(){
      showToast('Produzione registrata: lotto ' + finishedLotto + '.');
      state.produzione = freshProduzioneDraft();
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Si è verificato un errore durante il salvataggio della produzione. Controlla le giacenze.');
    });
  }

  function confirmPush(){
    var m = state.pushModal;
    var p = productionById(m.productionId);
    if (!p) return;
    var location = document.getElementById('pushLocation').value;
    var qty = numOrNull(document.getElementById('pushQty').value);
    if (!qty || qty <= 0){ showToast('Inserisci una quantità maggiore di zero.'); return; }

    var resolveProduct;
    if (m.mode === 'new'){
      var newName = document.getElementById('pushNewName').value.trim();
      if (!newName){ showToast('Inserisci il nome del nuovo prodotto.'); return; }
      var newId = uid('liqprod');
      resolveProduct = window.__fb.setDoc(LIQ_PRODUCTS_COLL + '/' + newId, { name: newName, cat: 'Produzione', photo: null, unitVolumeMl: null, sku: null, unitsPerCarton: null }).then(function(){
        return { id: newId, name: newName };
      });
    } else {
      var productId = document.getElementById('pushProductId').value;
      var product = liquoriProductById(productId);
      if (!product){ showToast('Seleziona un prodotto.'); return; }
      resolveProduct = Promise.resolve({ id: product.id, name: product.name });
    }

    resolveProduct.then(function(product){
      var current = (state.liquoriStock[location] && state.liquoriStock[location][product.id]) || 0;
      var newQty = round(current + qty, 3);
      var patch = {}; patch[product.id] = newQty;
      return window.__fb.setDoc('stock_liquori/' + location, patch, true).then(function(){
        var locLabel = LOCATIONS.filter(function(l){return l.id===location;})[0].label;
        var movEntry = {
          type:'carico', location: location, locationLabel: locLabel, productId: product.id, productName: product.name,
          delta: qty, newQty: newQty, causale: 'Produzione lotto ' + p.finishedLotto,
          ts: new Date().toISOString(), id: uid('mv')
        };
        var updatedMoves = state.liquoriMovements.concat([movEntry]);
        return window.__fb.setDoc(LIQ_MOVES_DOC, { entries: updatedMoves });
      }).then(function(){
        var pushes = (p.pushes||[]).concat([{ productId: product.id, productName: product.name, location: location, locationLabel: LOCATIONS.filter(function(l){return l.id===location;})[0].label, qty: qty, at: new Date().toISOString() }]);
        return window.__fb.setDoc(PRODUCTIONS_COLL + '/' + p.id, { pushes: pushes }, true);
      });
    }).then(function(){
      showToast('Caricato in Giacenze Liquori.');
      closePushModal();
    }).catch(function(e){
      console.error(e);
      showToast('Operazione non riuscita. Riprova.');
    });
  }

  function compressImageForInvoice(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, INVOICE_IMAGE_MAX_DIM / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          try {
            var dataUrl = canvas.toDataURL('image/jpeg', INVOICE_IMAGE_QUALITY);
            resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
          } catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function readFileAsBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var dataUrl = reader.result;
        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mediaType: file.type || 'application/pdf' });
      };
      reader.readAsDataURL(file);
    });
  }

  function handleFatturaFileSelected(file){
    if (!file) return;
    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    state.fattura.fileName = file.name || (isPdf ? 'fattura.pdf' : 'fattura.jpg');
    var task = isPdf ? readFileAsBase64(file) : compressImageForInvoice(file);
    task.then(function(res){
      state.fattura.base64 = res.base64;
      state.fattura.mediaType = res.mediaType;
      state.fattura.previewUrl = isPdf ? '' : res.dataUrl;
      render();
    }).catch(function(err){

    });
  }

  function analyzeFattura(){

    var body = {
      model: ai.model,

                  quantita: { type: ['number','null'], description: 'Quantità numerica' },

      tool_choice: { type: 'tool', name: 'registra_righe_fattura' },
      messages: [{
        role: 'user',

          { type: contentType, source: { type: 'base64', media_type: d.mediaType, data: d.base64 } },
          { type: 'text', text: 'Questa è una fattura di un fornitore di materie prime per un\'azienda che produce liquori (alcol, zucchero, aromi, frutta, acqua, ecc.). Estrai ogni riga di prodotto con quantità, unità di misura, numero di lotto e codice articolo/prodotto del fornitore, se presenti. Ignora totali, IVA, spese di trasporto, sconti e note generiche. Usa lo strumento fornito per rispondere.' }
        ]

    fetch('https://api.anthropic.com/v1/messages', {

        'x-api-key': ai.apiKey,

        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function(res){
      if (!res.ok){
        return res.json().catch(function(){ return null; }).then(function(errBody){
          var msg = errBody && errBody.error && errBody.error.message ? errBody.error.message : ('Errore HTTP ' + res.status);
          throw new Error(msg);
        });
      }
      return res.json();
    }).then(function(data){
      var toolUse = (data.content || []).filter(function(b){ return b.type === 'tool_use'; })[0];
      if (!toolUse || !toolUse.input){ throw new Error('Risposta IA non valida.'); }
      openInvoiceReviewModal(toolUse.input);
    }).catch(function(e){
      console.error(e);
      var msg = e.message || 'Analisi non riuscita.';
      if (/401|invalid.*api.*key|authentication/i.test(msg)) msg = 'Chiave API non valida. Controlla le impostazioni.';
      else if (/429|rate.?limit/i.test(msg)) msg = 'Limite di richieste raggiunto sul tuo account Anthropic. Riprova tra poco.';
      showToast(msg);
    }).finally(function(){
      d.analyzing = false;
      render();
