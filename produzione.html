<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Produzione Materie Prime</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/produzione-32.png">
<link rel="apple-touch-icon" href="icons/produzione-180.png">
<link rel="manifest" href="manifest-produzione.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Produzione">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --accent:#ffb000;
    --rowpad:.42rem;
    --bg:#000000;
    --surface:#0c0c0c;
    --surface-2:#171717;
    --ink:#ffffff;
    --muted:#c2c2c2;
    --line:#3d3d3d;
    --terra:var(--accent);
    --terra-ink:#000000;
    --good:#4ade80;
    --good-ink:#000000;
    --bad:#ff6b6b;
    --bad-ink:#000000;
    --warn:#ffd166;
    --warn-ink:#000000;
    --shadow:none;
  }

  *{ box-sizing:border-box; touch-action:manipulation; }
  html, body{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y:contain;
  }
  input, textarea, select{ -webkit-user-select:text; user-select:text; }
  .app{ max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:3rem; }
  @media (min-width:860px){
    .app{ max-width:1200px; }
    main.view{ padding-left:1.5rem; padding-right:1.5rem; }
    .form-card{ padding:1.2rem 1.4rem; gap:.95rem; }
    .row-split, .row-split3{ gap:1rem; }
  }

  header.top{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 18px -14px rgba(20,12,6,.35);
    border-bottom:1px solid var(--line);
    padding:.85rem 1rem .7rem;
  }
  .top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }
  .brand h1{
    margin:0; font-family:'Work Sans', system-ui, sans-serif; font-weight:700; font-size:1.28rem;
    letter-spacing:.02em; text-transform:uppercase; line-height:1.15; color:var(--terra);
  }
  .brand p{ margin:.2rem 0 0; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:'Work Sans', system-ui, sans-serif; }
  .top-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:.4rem; flex:none; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center; width:2.1rem; height:2.1rem;
    border-radius:.5rem; border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    cursor:pointer; transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }
  .top-icons{ display:flex; gap:.35rem; }
  .sync-pill{ display:flex; align-items:center; gap:.4rem; font-size:.68rem; color:var(--muted); white-space:nowrap; padding-top:.25rem; }
  .sync-dot{ width:.5rem; height:.5rem; border-radius:50%; background:var(--muted); flex:none; }
  .sync-dot.synced{ background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .sync-dot.error{ background:var(--bad); }
  .signout-btn{
    display:flex; align-items:center; justify-content:center; width:1.6rem; height:1.6rem; border-radius:.4rem;
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted); cursor:pointer; flex:none;
  }
  .signout-btn svg{ width:12px; height:12px; }
  .signout-btn[hidden]{ display:none; }

  nav.tabs{
    display:flex; gap:.4rem; background:var(--bg); padding:.6rem .75rem 0;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:.25rem; flex:none;
    padding:.5rem .8rem .55rem; border-radius:.65rem; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-family:'Work Sans', system-ui, sans-serif; font-size:.68rem; letter-spacing:.04em;
    text-transform:uppercase; cursor:pointer; min-height:44px; min-width:4.6rem;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn svg{ width:18px; height:18px; }
  .tab-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }

  main.view{ padding:.9rem .75rem 0; }
  .search-wrap{ padding:0 0 .6rem; }
  .search-wrap input{
    width:100%; padding:.6rem .8rem; border-radius:.6rem; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:'Work Sans', sans-serif; font-size:.9rem;
  }
  .search-wrap input:focus{ outline:2px solid var(--terra); outline-offset:1px; }

  .section-title{
    font-family:'Work Sans', system-ui, sans-serif; font-weight:600; font-size:.95rem; text-transform:uppercase;
    letter-spacing:.03em; color:var(--terra); margin:.2rem 0 .6rem;
  }
  .section-sub{ font-size:.78rem; color:var(--muted); margin:-.4rem 0 .8rem; line-height:1.4; }

  .list{ display:flex; flex-direction:column; gap:.55rem; margin-bottom:1rem; }
  .empty{ text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 1rem; line-height:1.5; }

  .ref-badge{
    font-family:'Work Sans', system-ui, sans-serif; font-size:.6rem; text-transform:uppercase; letter-spacing:.04em;
    padding:.12rem .45rem; border-radius:1rem; white-space:nowrap; flex:none;
  }
  .ref-badge.liquido{ background:var(--good); color:var(--good-ink); }
  .ref-badge.solido{ background:var(--warn); color:var(--warn-ink); }
  .lot-mini-btn{
    flex:none; padding:.3rem .5rem; border-radius:.4rem; border:1px solid var(--line);
    background:var(--surface); color:var(--terra); font-family:'Work Sans', system-ui, sans-serif; font-size:.6rem;
    text-transform:uppercase; cursor:pointer;
  }

  .ai-warning{
    background:color-mix(in srgb, var(--bad) 12%, var(--surface)); border:1px solid var(--bad);
    color:var(--ink); border-radius:.6rem; padding:.65rem .8rem; font-size:.78rem; line-height:1.5; margin-bottom:.8rem;
  }
  .ai-warning a, .ai-warning button.link-btn{
    color:var(--bad); font-weight:600; text-decoration:underline; background:none; border:none; padding:0;
    cursor:pointer; font-size:inherit; font-family:inherit;
  }
  .file-picker-row{ display:flex; gap:.5rem; flex-wrap:wrap; }
  .file-picker-btn{
    flex:1; min-width:9rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
    padding:1.1rem .6rem; border-radius:.7rem; border:1.5px dashed var(--line); background:var(--surface-2);
    color:var(--muted); cursor:pointer; font-family:'Work Sans', system-ui, sans-serif; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em;
  }
  .file-picker-btn svg{ width:22px; height:22px; color:var(--terra); }
  .file-chosen{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.7rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:.6rem; padding:.55rem .7rem; font-size:.82rem;
  }
  .file-chosen-remove{
    flex:none; width:1.8rem; height:1.8rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .invoice-line{
    background:var(--surface-2); border:1px solid var(--line); border-radius:.7rem; padding:.7rem .75rem;
    display:flex; flex-direction:column; gap:.55rem; margin-bottom:.7rem;
  }
  .invoice-line-top{ display:flex; align-items:flex-start; gap:.5rem; justify-content:space-between; }
  .invoice-line-check{ display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--muted); flex:none; }
  .invoice-line-check input{ width:1.1rem; height:1.1rem; }
  .invoice-raw{
    font-size:.68rem; color:var(--muted); font-style:italic; background:var(--surface); border-radius:.4rem;
    padding:.35rem .5rem; line-height:1.4;
  }

  .form-card{ background:var(--surface); border:1px solid var(--line); border-radius:.75rem; padding:.85rem; display:flex; flex-direction:column; gap:.7rem; margin-bottom:1rem; }
  .field label{
    font-family:'Work Sans', system-ui, sans-serif; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); display:block; margin-bottom:.25rem;
  }
  .field{ display:flex; flex-direction:column; }
  .field input, .field select, .field textarea{
    padding:.55rem .7rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); font-family:'Work Sans', sans-serif; font-size:.9rem; width:100%;
  }
  .field textarea{ resize:vertical; min-height:2.4rem; }
  .field select{
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2c2c2' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right .6rem center; background-size:16px; padding-right:2rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--terra); outline-offset:1px; }
  .field-hint{ font-size:.68rem; color:var(--muted); margin-top:.25rem; }
  .row-split{ display:grid; grid-template-columns:1fr 1fr; gap:.55rem; }
  .row-split3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  .readonly-box{
    padding:.55rem .7rem; border-radius:.5rem; border:1px dashed var(--line); background:var(--surface-2);
    color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:.88rem; font-weight:700;
  }
  .readonly-box .unit{ font-family:'Work Sans', sans-serif; font-weight:500; font-size:.65rem; color:var(--muted); text-transform:uppercase; margin-left:.25rem; }

  .seg{ display:flex; gap:.4rem; }
  .seg-btn{
    flex:1; padding:.55rem .4rem; border-radius:.55rem; border:1px solid var(--line); background:var(--surface-2);
    color:var(--muted); font-family:'Work Sans', system-ui, sans-serif; font-size:.68rem; text-transform:uppercase;
    letter-spacing:.03em; cursor:pointer; transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .seg-btn.active{ background:var(--terra); border-color:var(--terra); color:var(--terra-ink); }

  .btn{
    padding:.6rem 1rem; border-radius:.55rem; border:none; font-family:'Work Sans', system-ui, sans-serif; font-size:.74rem;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer; transition:opacity .15s ease;
  }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn-primary{ background:var(--terra); color:var(--terra-ink); }
  .btn-good{ background:var(--good); color:var(--good-ink); }
  .btn-bad{ background:var(--bad); color:var(--bad-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:.5rem; justify-content:flex-end; flex-wrap:wrap; }
  .btn-block{ width:100%; }

  .add-toggle{
    width:100%; padding:.65rem; border-radius:.6rem; border:1px dashed var(--line); background:transparent;
    color:var(--muted); font-family:'Work Sans', sans-serif; font-size:.85rem; font-weight:600; cursor:pointer;
    margin-bottom:.8rem; transition:border-color .15s ease, color .15s ease;
  }
  .add-toggle:hover{ border-color:var(--terra); color:var(--terra); }

  /* Dense, row-based data tables (Materie Prime, Storico, Produzioni) —
     no photos, just columns, comfortable on a wide desktop screen and still
     easy to tap on a phone (horizontal scroll rather than a cramped fit). */
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:1rem; border:1px solid var(--line); border-radius:.6rem; }
  table.data-table{ width:100%; border-collapse:collapse; background:var(--surface); font-size:.84rem; }
  table.data-table th, table.data-table td{
    padding:.6rem .7rem; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line);
  }
  table.data-table th{
    font-family:'Work Sans', system-ui, sans-serif; font-size:.64rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); background:var(--surface-2); position:sticky; top:0;
  }
  table.data-table tbody tr:last-child td{ border-bottom:none; }
  table.data-table tbody tr:hover{ background:color-mix(in srgb, var(--terra) 6%, var(--surface)); }
  table.data-table td.num{ font-family:'IBM Plex Mono', monospace; text-align:right; }
  table.data-table td.wrap{ white-space:normal; min-width:10rem; }
  table.data-table tr.sub-row td{ background:var(--surface-2); }
  table.data-table tr.sub-row.expired td{ background:color-mix(in srgb, var(--bad) 10%, var(--surface-2)); }
  table.data-table .row-actions{ display:flex; gap:.35rem; flex-wrap:nowrap; }
  table.data-table .row-actions button{
    flex:none; padding:.3rem .55rem; border-radius:.4rem; border:1px solid var(--line);
    background:var(--surface); color:var(--terra); font-family:'Work Sans', system-ui, sans-serif; font-size:.62rem;
    text-transform:uppercase; cursor:pointer; white-space:nowrap;
  }
  .expiry-tag{ font-size:.68rem; }
  .expiry-tag.expired{ color:var(--bad); font-weight:700; }
  .expiry-tag.soon{ color:var(--warn); font-weight:700; }

  .component-row{
    background:var(--surface-2); border:1px solid var(--line); border-radius:.6rem; padding:.55rem .6rem;
    display:flex; flex-direction:column; gap:.45rem;
  }
  .component-row-top{ display:flex; gap:.4rem; align-items:flex-end; }
  .component-row-top .field{ flex:1; min-width:0; }
  .component-del{
    flex:none; width:2.2rem; height:2.2rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .component-del svg{ width:15px; height:15px; }

  .alloc-row{ display:flex; gap:.4rem; align-items:flex-end; }
  .alloc-row .field{ flex:1; min-width:0; }
  .alloc-del{
    flex:none; width:2.2rem; height:2.2rem; border-radius:.5rem; border:1px solid var(--line); background:var(--surface);
    color:var(--bad); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .alloc-del svg{ width:14px; height:14px; }
  .alloc-summary{ font-size:.72rem; color:var(--muted); }
  .alloc-summary.ok{ color:var(--good); }
  .alloc-summary.warn{ color:var(--bad); }

  .prod-card{ background:var(--surface); border:1px solid var(--line); border-radius:.7rem; padding:.65rem .75rem; box-shadow:var(--shadow); margin-bottom:.6rem; }
  .prod-top{ display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
  .prod-lotto{ font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:.9rem; }
  .prod-date{ font-size:.66rem; color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .prod-meta{ font-size:.75rem; color:var(--muted); margin-top:.25rem; line-height:1.5; }
  .prod-comps{ font-size:.72rem; color:var(--ink); margin-top:.4rem; line-height:1.6; }
  .prod-comps summary{ cursor:pointer; color:var(--terra); font-size:.72rem; font-family:'Work Sans', system-ui, sans-serif; text-transform:uppercase; letter-spacing:.03em; }
  .prod-push-row{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.55rem; }
  .prod-push-status{ font-size:.7rem; color:var(--muted); }


  .modal-overlay[hidden]{ display:none; }
  .modal-overlay{ position:fixed; inset:0; z-index:50; background:rgba(20,12,6,.45); display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:560px){ .modal-overlay{ align-items:center; padding:1rem; } }
  .modal-sheet{
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto; background:var(--surface);
    border-radius:1rem 1rem 0 0; padding:1.1rem 1.1rem 1.4rem; box-shadow:0 -4px 24px rgba(20,12,6,.25);
  }
  @media (min-width:560px){ .modal-sheet{ border-radius:1rem; } }
  .modal-title{ font-family:'Work Sans', system-ui, sans-serif; font-weight:700; font-size:1.05rem; margin:0 0 .2rem; }
  .modal-subtitle{ font-size:.8rem; color:var(--muted); margin:0 0 1rem; }
  .modal-hint{ font-size:.74rem; color:var(--muted); margin:-.35rem 0 .7rem; }
  .modal-hint.warn{ color:var(--bad); }

  .auth-gate[hidden]{ display:none; }
  .auth-gate{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .auth-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:1rem; padding:1.7rem 1.4rem 1.5rem; box-shadow:var(--shadow); }
  .auth-title{ font-family:'Work Sans', system-ui, sans-serif; font-weight:700; font-size:1.4rem; text-transform:uppercase; letter-spacing:.02em; margin:0 0 .1rem; color:var(--terra); text-align:center; }
  .auth-subtitle{ font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:'Work Sans', system-ui, sans-serif; text-align:center; margin:0 0 1.5rem; }
  .auth-submit{ width:100%; padding:.75rem; font-size:.78rem; }
  .modal-field{ margin-bottom:.85rem; }

  .toast{
    position:fixed; left:50%; bottom:1.1rem; transform:translateX(-50%) translateY(6px); max-width:88vw;
    background:var(--ink); color:var(--bg); padding:.6rem .7rem .6rem .9rem; border-radius:.6rem; font-size:.78rem;
    line-height:1.4; box-shadow:0 10px 24px rgba(0,0,0,.3); display:flex; align-items:center; gap:.6rem;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast-retry{
    flex:none; background:transparent; border:1px solid color-mix(in srgb, var(--bg) 45%, transparent);
    color:var(--bg); border-radius:.4rem; padding:.28rem .6rem; font-size:.7rem; cursor:pointer;
    font-family:'Work Sans', system-ui, sans-serif; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Scheda di Produzione — printable production sheet */
  .scheda-sheet{ background:#fff; color:#111; padding:1.2rem; border-radius:.6rem; border:1px solid var(--line); }
  .scheda-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; border-bottom:2px solid #111; padding-bottom:.7rem; margin-bottom:.9rem; }
  .scheda-header h2{ margin:0; font-family:'Work Sans', system-ui, sans-serif; text-transform:uppercase; letter-spacing:.03em; font-size:1.2rem; }
  .scheda-header p{ margin:.2rem 0 0; font-size:.78rem; color:#555; }
  .scheda-meta-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(10rem,1fr)); gap:.6rem 1.2rem; margin-bottom:1rem; font-size:.84rem; }
  .scheda-meta-grid .k{ font-family:'Work Sans', system-ui, sans-serif; font-size:.62rem; text-transform:uppercase; letter-spacing:.04em; color:#777; display:block; }
  .scheda-meta-grid .v{ font-weight:600; }
  .scheda-sheet table.data-table{ font-size:.8rem; }
  .scheda-sheet table.data-table th{ background:#eee; color:#333; }
  .scheda-print-btn{ margin-bottom:1rem; }
  @media print{
    body *{ visibility:hidden; }
    .scheda-sheet, .scheda-sheet *{ visibility:visible; }
    .scheda-sheet{ position:absolute; left:0; top:0; width:100%; border:none; }
    .scheda-print-btn, header.top, nav.tabs, .toast{ display:none !important; }
  }

  /* ===== Gestionale layout (stile Easyfatt, scuro ad alto contrasto) ===== */
  html{ font-size:16px; }
  body{ font-size:.95rem; }
  .app{ max-width:none; margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; padding-bottom:0; background:var(--bg); }
  header.top{ position:static; flex:none; background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:none; border-bottom:1px solid var(--line); padding:0; }
  .menubar{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:0 .5rem; border-bottom:1px solid var(--line); background:var(--surface-2); min-height:2.1rem; }
  .menus{ display:flex; align-items:center; gap:.1rem; }
  .brand-mini{ font-weight:800; color:var(--accent); letter-spacing:.04em; font-size:.8rem; padding:0 .7rem 0 .2rem; text-transform:uppercase; white-space:nowrap; }
  .menu{ position:relative; }
  .menu-btn{ background:none; border:none; color:var(--ink); font:inherit; font-size:.85rem; padding:.4rem .7rem; cursor:pointer; border-radius:.3rem; }
  .menu-btn:hover, .menu.open .menu-btn{ background:var(--accent); color:var(--terra-ink); }
  .menu-pop{ position:absolute; top:100%; left:0; min-width:15rem; background:var(--surface); border:1px solid var(--ink); z-index:60; padding:.25rem 0; box-shadow:0 8px 24px rgba(0,0,0,.8); }

  };

  var fbApp = initializeApp(firebaseConfig);
  var fs = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true });
  var fbAuth = getAuth(fbApp);

  function pathToRef(path){
    var parts = path.split('/');
    return doc.apply(null, [fs].concat(parts));
  }

  window.__fb = {
    signIn: function(email, password){ return signInWithEmailAndPassword(fbAuth, email, password); },

  // ---------- data helpers ----------
  function referenceById(id){ return state.references.filter(function(r){ return r.id === id; })[0] || null; }
  function lotById(id){ return state.lots.filter(function(l){ return l.id === id; })[0] || null; }
  function lotsForRef(refId){ return state.lots.filter(function(l){ return l.refId === refId; }); }
  function recipeById(id){ return state.recipes.filter(function(r){ return r.id === id; })[0] || null; }
  function productionById(id){ return state.productions.filter(function(p){ return p.id === id; })[0] || null; }
  function liquoriProductById(id){ return state.liquoriProducts.filter(function(p){ return p.id === id; })[0] || null; }

  function totalStock(refId){
    var lots = lotsForRef(refId);
    var lt = 0, kg = 0, hasLt = false, hasKg = false;
    lots.forEach(function(l){
      if (l.qtyLt !== null && l.qtyLt !== undefined){ lt += l.qtyLt; hasLt = true; }
      if (l.qtyKg !== null && l.qtyKg !== undefined){ kg += l.qtyKg; hasKg = true; }
    });
    return { lt: hasLt ? round(lt,3) : null, kg: hasKg ? round(kg,3) : null };
  }

  function anidriFor(qtyLt, grade){
    if (qtyLt === null || qtyLt === undefined || grade === null || grade === undefined) return null;
    return round(qtyLt * grade / 100, 3);
  }

  function consumeFromLot(lot, qty, unit){
    var newLt = lot.qtyLt, newKg = lot.qtyKg;
    if (unit === 'lt'){
      newLt = round(Math.max(0, (lot.qtyLt || 0) - qty), 3);
      if (lot.density) newKg = round(Math.max(0, (lot.qtyKg || 0) - qty * lot.density), 3);
    } else {
      newKg = round(Math.max(0, (lot.qtyKg || 0) - qty), 3);
      if (lot.density) newLt = round(Math.max(0, (lot.qtyLt || 0) - qty / lot.density), 3);
    }
    return { qtyLt: newLt, qtyKg: newKg };
  }

  function availableQty(lot, unit){
    if (unit === 'lt') return lot.qtyLt || 0;
    return lot.qtyKg || 0;
  }

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(message, retryFn){
    var el = document.getElementById('toast');
    el.innerHTML = '<span>' + escapeHtml(message) + '</span>' +
      (retryFn ? '<button type="button" class="toast-retry" id="toastRetryBtn">Riprova</button>' : '');
    if (retryFn){
      document.getElementById('toastRetryBtn').addEventListener('click', function(){ hideToast(); retryFn(); });
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);

  function setSyncStatus(kind){
    var dot = document.getElementById('syncDot');

    dot.className = 'sync-dot ' + kind;
    if (kind === 'synced') label.textContent = 'Sincronizzato';

  // focus (and cursor position) to the equivalent element after a render.
  // ==================================================================
  // RENDER: top-level
  // ==================================================================
  var lastRenderedView = null;
  var GRID_VIEWS = ['materie', 'lotti', 'produzioni', 'storico'];
  function render(){
    applyPrefs();
    renderMenus();
    renderTabs();
    renderView();
    renderStatusBar();

  // Un nuovo render sostituisce il DOM: qui si conserva lo scroll (griglia e pagina) e il focus, se la vista è la stessa.
  function renderView(){
    var root = document.getElementById('viewRoot');
    var wrap = root.querySelector('.grid-wrap');
    var saved = { top: root.scrollTop, gt: wrap ? wrap.scrollTop : 0, gl: wrap ? wrap.scrollLeft : 0 };
    var html = '';
    var v = state.view;
    if (v === 'materie') html = renderMaterieView();
    else if (v === 'lotti') html = renderLottiView();
    else if (v === 'prodotti') html = renderRicetteView();
    else if (v === 'produzioni') html = renderProduzioniView();
    else if (v === 'storico') html = renderStoricoView();
    else if (v === 'carico') html = renderCaricoView();
    else if (v === 'scarico') html = renderScaricoView();
    else if (v === 'produzione') html = renderProduzioneView();
    else if (v === 'fattura') html = renderFatturaView();
    else if (v === 'scheda') html = renderSchedaView();
    var isGrid = GRID_VIEWS.indexOf(v) !== -1 || (v === 'prodotti' && !state.ricette.formOpen);
    root.className = 'view' + (isGrid ? ' gridmode' : '');
    root.innerHTML = html;
    if (lastRenderedView === v){
      root.scrollTop = saved.top;
      var w2 = root.querySelector('.grid-wrap');
      if (w2){ w2.scrollTop = saved.gt; w2.scrollLeft = saved.gl; }
    }
    lastRenderedView = v;
  }

  function focusLocator(el){
    if (!el || el === document.body) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    var dataAttrs = Array.prototype.filter.call(el.attributes || [], function(a){ return a.name.indexOf('data-') === 0; });
    if (!dataAttrs.length) return null;
    return el.tagName.toLowerCase() + dataAttrs.map(function(a){ return '[' + a.name + '="' + a.value.replace(/"/g,'\\"') + '"]'; }).join('');
  }
  function withFocusPreserved(fn){
    var active = document.activeElement;
    var locator = focusLocator(active);
    var selStart, selEnd;
    if (active && typeof active.selectionStart === 'number'){
      try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
    }
    fn();
    if (!locator) return;
    var el;
    try { el = document.querySelector(locator); } catch(e){ el = null; }
    if (!el) return;
    el.focus();
    if (selStart !== undefined && typeof el.setSelectionRange === 'function'){
      try { el.setSelectionRange(selStart, selEnd); } catch(e){}
    }
  }

  function fieldInput(id, label, type, value, extra){
    return '<div class="field"><label for="' + id + '">' + escapeHtml(label) + '</label><input type="' + type + '" id="' + id + '" value="' + escapeHtml(value === null || value === undefined ? '' : value) + '" ' + (extra||'') + '></div>';
  }
  function fieldSelect(id, label, options, value){
    var html = '<div class="field"><label for="' + id + '">' + escapeHtml(label) + '</label><select id="' + id + '">';
    options.forEach(function(o){
      html += '<option value="' + escapeHtml(o.value) + '"' + (String(value||'') === String(o.value) ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>';
    });
    html += '</select></div>';
    return html;
  }

    (p.components||[]).forEach(function(c){

  // ==================================================================
  // MODAL: edit lot stock directly (manual correction)

  function openLotModal(lotId){
    var lot = lotById(lotId);
    if (!lot) return;
    state.lotModal = {
      lotId: lotId,
      draft: {
        qtyLt: lot.qtyLt === null || lot.qtyLt === undefined ? '' : lot.qtyLt,
        qtyKg: lot.qtyKg === null || lot.qtyKg === undefined ? '' : lot.qtyKg,
        density: lot.density === null || lot.density === undefined ? '' : lot.density,
        grade: lot.grade === null || lot.grade === undefined ? '' : lot.grade,
        scadenza: lot.scadenza || ''
      }
    };
    renderLotModal();
  }
  function closeLotModal(){
    state.lotModal = null;
    document.getElementById('lotModalOverlay').hidden = true;
    document.getElementById('lotModalOverlay').innerHTML = '';
  }

  function renderLotModal(){
    var overlay = document.getElementById('lotModalOverlay');
    var m = state.lotModal;
    if (!m){ overlay.hidden = true; return; }
    var lot = lotById(m.lotId);
    if (!lot){ closeLotModal(); return; }
    var ref = referenceById(lot.refId);
    var d = m.draft;
    var html = '<div class="modal-sheet">';
    html += '<h2 class="modal-title">Modifica giacenza lotto</h2>';
    html += '<p class="modal-subtitle">' + escapeHtml(lot.refName) + ' — Lotto ' + escapeHtml(lot.lotto) + '</p>';
    html += '<p class="modal-hint">Corregge direttamente la quantità disponibile di questo lotto, senza registrare un carico o uno scarico.</p>';

    html += '<div class="row-split3">';
    html += '<div class="modal-field"><label>Quantità (Lt)</label><input type="number" step="0.001" min="0" id="lotQtyLt" value="' + escapeHtml(d.qtyLt) + '"></div>';
    html += '<div class="modal-field"><label>Quantità (Kg)</label><input type="number" step="0.001" min="0" id="lotQtyKg" value="' + escapeHtml(d.qtyKg) + '"></div>';
    html += '<div class="modal-field"><label>Densità (kg/Lt)</label><input type="number" step="0.0001" min="0" id="lotDensity" value="' + escapeHtml(d.density) + '"></div>';
    html += '</div>';
    if (ref && ref.unit === 'liquido'){
      html += '<div class="modal-field"><label>Gradazione (%)</label><input type="number" step="0.1" min="0" max="100" id="lotGrade" value="' + escapeHtml(d.grade) + '"></div>';
    }
    html += '<div class="modal-field"><label>Scadenza (opzionale)</label><input type="date" id="lotScadenza" value="' + escapeHtml(d.scadenza) + '"></div>';

    html += '<div class="btn-row"><button type="button" class="btn btn-ghost" data-action="close-lot-modal">Annulla</button><button type="button" class="btn btn-primary" data-action="save-lot">Salva</button></div>';
    html += '</div>';
    overlay.innerHTML = html;
    overlay.hidden = false;
  }

  function handleLotModalInput(target){
    var d = state.lotModal.draft;
    var lt = document.getElementById('lotQtyLt');
    var kg = document.getElementById('lotQtyKg');
    var dens = document.getElementById('lotDensity');
    var density = numOrNull(dens.value);
    if (target.id === 'lotQtyLt'){
      d.qtyLt = lt.value;
      var ltVal = numOrNull(lt.value);
      if (density !== null && ltVal !== null){ var k = round(ltVal * density, 3); kg.value = k; d.qtyKg = k; }
    } else if (target.id === 'lotQtyKg'){
      d.qtyKg = kg.value;
      var kgVal = numOrNull(kg.value);
      if (density !== null && kgVal !== null){ var l = round(kgVal / density, 3); lt.value = l; d.qtyLt = l; }
    } else if (target.id === 'lotDensity'){
      d.density = dens.value;
      var ltVal3 = numOrNull(lt.value);
      var kgVal3 = numOrNull(kg.value);
      if (density !== null && ltVal3 !== null){ var k2 = round(ltVal3 * density, 3); kg.value = k2; d.qtyKg = k2; }
      else if (density !== null && kgVal3 !== null){ var l2 = round(kgVal3 / density, 3); lt.value = l2; d.qtyLt = l2; }
    }
  }

  // Same reasoning as handleCaricoBlurAutoDensity: only derive density from
  // Lt+Kg once the user finishes editing one of the two fields, not on every
  // keystroke, or a half-typed number locks in the wrong value.
  function handleLotModalBlurAutoDensity(){
    var d = state.lotModal.draft;
    var lt = document.getElementById('lotQtyLt');
    var kg = document.getElementById('lotQtyKg');
    var dens = document.getElementById('lotDensity');
    if (!lt || !kg || !dens) return;
    if (numOrNull(dens.value) !== null) return;
    var ltVal = numOrNull(lt.value);
    var kgVal = numOrNull(kg.value);
    if (ltVal !== null && ltVal > 0 && kgVal !== null){
      var computed = round(kgVal / ltVal, 4);
      dens.value = computed;
      d.density = computed;
    }
  }

  function saveLotEdit(){
    var m = state.lotModal;
    var lot = lotById(m.lotId);
    if (!lot) return;
    var ref = referenceById(lot.refId);
    var newQtyLt = numOrNull(document.getElementById('lotQtyLt').value);
    var newQtyKg = numOrNull(document.getElementById('lotQtyKg').value);
    var newDensity = numOrNull(document.getElementById('lotDensity').value);
    var gradeInput = document.getElementById('lotGrade');
    var newGrade = gradeInput ? numOrNull(gradeInput.value) : (lot.grade === undefined ? null : lot.grade);
    var newScadenza = document.getElementById('lotScadenza').value || null;

    var oldPrimary = ref && ref.unit === 'liquido' ? (lot.qtyLt || 0) : (lot.qtyKg || 0);
    var patch = {
      qtyLt: newQtyLt === null ? null : round(newQtyLt, 3),
      qtyKg: newQtyKg === null ? null : round(newQtyKg, 3),
      density: newDensity,
      grade: newGrade,
      scadenza: newScadenza
    };
    var newPrimary = ref && ref.unit === 'liquido' ? (patch.qtyLt || 0) : (patch.qtyKg || 0);
    var delta = round(newPrimary - oldPrimary, 3);

    window.__fb.setDoc(LOTS_COLL + '/' + lot.id, patch, true).then(function(){
      Object.keys(patch).forEach(function(k){ lot[k] = patch[k]; });
      if (delta !== 0){
        logProdMovement({
          type:'correzione', refId: lot.refId, refName: lot.refName, lotto: lot.lotto,
          unit: ref && ref.unit === 'liquido' ? 'lt' : 'kg',
          delta: delta,
          causale: 'Correzione manuale giacenza'
        });
      }
      showToast('Giacenza aggiornata.');
      closeLotModal();
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Salvataggio non riuscito. Riprova.', saveLotEdit);
    });
  }

    state.pushModal = { productionId: productionId, mode:'existing', productId:'', newName:'', location: LOCATIONS[0].id, qty: remaining };

    html += '</div>';
    overlay.innerHTML = html;

  // specific batch.
  function backfillLotsDensity(refId, density){
    // A now-fixed earlier bug stored qtyLt as 0 (instead of leaving it empty)
    // on liquid lots carico'd with Kg only, so an exact 0 is treated the same
    // as "never recorded" here — never a real, intentionally-tracked zero.
    var toFix = lotsForRef(refId).filter(function(l){ return l.density === null || l.density === undefined; });
    if (!toFix.length) return Promise.resolve();
    return Promise.all(toFix.map(function(l){
      var patch = { density: density };
      if (l.qtyKg && !l.qtyLt){
        patch.qtyLt = round(l.qtyKg / density, 3);
      } else if (l.qtyLt && !l.qtyKg){
        patch.qtyKg = round(l.qtyLt * density, 3);
      }
      Object.keys(patch).forEach(function(k){ l[k] = patch[k]; }); // reflect locally without waiting on the listener
      return window.__fb.setDoc(LOTS_COLL + '/' + l.id, patch, true);
    }));
  }

  // waiting for Firestore's listener to echo each write back.
  function commitCarico(ref, lotto, qtyLt, qtyKg, density, grade, causale, scadenza){
    var lotId = lotDocId(ref.id, lotto);
    var existing = lotById(lotId);
    var newQtyLt = (existing ? (existing.qtyLt||0) : 0) + (qtyLt || 0);
    var newQtyKg = (existing ? (existing.qtyKg||0) : 0) + (qtyKg || 0);
    var hasLt = qtyLt !== null || (existing && existing.qtyLt !== null && existing.qtyLt !== undefined);
    var docData = {
      refId: ref.id, refName: ref.name, lotto: lotto, unit: ref.unit,
      density: density !== null ? density : (existing ? existing.density : null),
      grade: grade !== null ? grade : (existing ? existing.grade : null),
      scadenza: scadenza ? scadenza : (existing ? (existing.scadenza || null) : null),
      qtyLt: hasLt ? round(newQtyLt,3) : null,
      qtyKg: round(newQtyKg,3),
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    return window.__fb.setDoc(LOTS_COLL + '/' + lotId, docData).then(function(){
      if (existing){ Object.keys(docData).forEach(function(k){ existing[k] = docData[k]; }); }
      else { state.lots.push(Object.assign({ id: lotId }, docData)); }
      logProdMovement({
        type:'carico', refId: ref.id, refName: ref.name, lotto: lotto,
        unit: ref.unit === 'liquido' ? 'lt' : 'kg',
        delta: ref.unit === 'liquido' ? (qtyLt || 0) : (qtyKg || 0),
        causale: causale || null
      });
    });
  }

  function confirmPush(){
    var m = state.pushModal;
    var p = productionById(m.productionId);
    if (!p) return;
    var location = document.getElementById('pushLocation').value;
    var qty = numOrNull(document.getElementById('pushQty').value);
    if (!qty || qty <= 0){ showToast('Inserisci una quantità maggiore di zero.'); return; }

    var resolveProduct;
    if (m.mode === 'new'){
      var newName = document.getElementById('pushNewName').value.trim();

        return { id: newId, name: newName };
      });

      var productId = document.getElementById('pushProductId').value;
      var product = liquoriProductById(productId);
      if (!product){ showToast('Seleziona un prodotto.'); return; }
      resolveProduct = Promise.resolve({ id: product.id, name: product.name });
    }

    resolveProduct.then(function(product){
      var current = (state.liquoriStock[location] && state.liquoriStock[location][product.id]) || 0;
      var newQty = round(current + qty, 3);
      var patch = {}; patch[product.id] = newQty;
      return window.__fb.setDoc('stock_liquori/' + location, patch, true).then(function(){
        var locLabel = LOCATIONS.filter(function(l){return l.id===location;})[0].label;
        var movEntry = {
          type:'carico', location: location, locationLabel: locLabel, productId: product.id, productName: product.name,
          delta: qty, newQty: newQty, causale: 'Produzione lotto ' + p.finishedLotto,

        };
        var updatedMoves = state.liquoriMovements.concat([movEntry]);
        return window.__fb.setDoc(LIQ_MOVES_DOC, { entries: updatedMoves });
      }).then(function(){
        var pushes = (p.pushes||[]).concat([{ productId: product.id, productName: product.name, location: location, locationLabel: LOCATIONS.filter(function(l){return l.id===location;})[0].label, qty: qty, at: new Date().toISOString() }]);
        return window.__fb.setDoc(PRODUCTIONS_COLL + '/' + p.id, { pushes: pushes }, true);
      });
    }).then(function(){
      showToast('Caricato in Giacenze Liquori.');
      closePushModal();
    }).catch(function(e){

      showToast('Operazione non riuscita. Riprova.');
    });

  function compressImageForInvoice(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, INVOICE_IMAGE_MAX_DIM / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          try {
            var dataUrl = canvas.toDataURL('image/jpeg', INVOICE_IMAGE_QUALITY);
            resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
          } catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function readFileAsBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var dataUrl = reader.result;
        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mediaType: file.type || 'application/pdf' });
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- matching riga fattura -> referenza esistente ----------
  function normalizeForMatch(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // Two tokens count as "the same word" if identical, or if one is a
  // (reasonably long) prefix of the other - catches plurals and abbreviated
  // endings ("etilico" / "etil.") without treating any short common word as
  // a match on its own.
  function tokensMatch(a, b){
    if (a === b) return true;
    if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
    return false;
  }
  function guessReferenceMatch(name){
    var norm = normalizeForMatch(name);
    if (!norm) return null;
    var normTokens = norm.split(' ').filter(Boolean);
    var best = null, bestScore = 0;
    state.references.forEach(function(r){
      var rNorm = normalizeForMatch(r.name);
      if (!rNorm) return;
      if (rNorm === norm){
        if (100 > bestScore){ bestScore = 100; best = r; }
        return;
      }
      var rTokens = rNorm.split(' ').filter(Boolean);
      var minLen = Math.min(normTokens.length, rTokens.length);
      // A single shared word (e.g. an existing reference literally called
      // "Zucchero") is not enough evidence on its own - require at least two
      // meaningful words on the shorter side before counting partial overlap,
      // and near-full coverage of it. A wrong auto-match silently mixes two
      // different products' stock, which is worse than asking the user to
      // pick manually - so when in doubt, this returns no match ("new").
      if (minLen < 2) return;
      var matchedCount = rTokens.filter(function(rt){
        return normTokens.some(function(nt){ return tokensMatch(nt, rt); });
      }).length;
      var overlapRatio = matchedCount / minLen;
      if (overlapRatio >= 0.8 && matchedCount >= 2){
        var score = 70 + overlapRatio * 20;
        if (score > bestScore){ bestScore = score; best = r; }
      }
    });
    return bestScore >= 70 ? best : null;
  }
  function guessQtyFromUnit(unitStr, quantity){
    var out = { qtyLt: '', qtyKg: '' };
    if (quantity === null || quantity === undefined || isNaN(quantity)) return out;
    var u = normalizeForMatch(unitStr);
    if (/^(kg|chilogramm|chilo)/.test(u)) out.qtyKg = quantity;
    else if (/^(l|lt|litr)/.test(u)) out.qtyLt = quantity;
    else if (/^(g|gr|grammi|grammo)/.test(u)) out.qtyKg = round(quantity / 1000, 3);
    else if (/^(ml|millilitri)/.test(u)) out.qtyLt = round(quantity / 1000, 3);
    return out;
  }

  // ==================================================================
  // MODAL: revisione righe fattura
  // ==================================================================
  // A shared product code is unambiguous even when the invoice's wording
  // doesn't resemble the saved name at all - it always wins over the
  // name-similarity guess.
  function guessReferenceMatchByCode(code){
    var norm = String(code || '').trim().toLowerCase();
    if (!norm) return null;
    for (var i = 0; i < state.references.length; i++){
      var r = state.references[i];
      if (r.codice && String(r.codice).trim().toLowerCase() === norm) return r;
    }
    return null;
  }
  function openInvoiceReviewModal(result){
    var righe = result.righe || [];
    var lines = righe.map(function(r){
      var match = guessReferenceMatchByCode(r.codice_prodotto) || guessReferenceMatch(r.nome_prodotto || r.descrizione);
      var qtyGuess = guessQtyFromUnit(r.unita, r.quantita);
      var matchDensity = match && match.density !== null && match.density !== undefined ? match.density : null;
      // The invoice only ever states one unit (e.g. "25 L"); when the
      // matched product's density is already known, fill in the other side
      // immediately so the reviewer sees both, not just whichever the
      // invoice happened to print.
      var qtyLt = qtyGuess.qtyLt, qtyKg = qtyGuess.qtyKg;
      if (matchDensity){
        if (qtyLt !== '' && qtyKg === '') qtyKg = round(qtyLt * matchDensity, 3);
        else if (qtyKg !== '' && qtyLt === '') qtyLt = round(qtyKg / matchDensity, 3);
      }
      return {
        include: true,
        rawDescription: r.descrizione || '',
        extractedName: r.nome_prodotto || r.descrizione || '',
        extractedUnit: r.unita || '',
        extractedCode: r.codice_prodotto || '',
        lotto: r.lotto || '',
        scadenza: /^\d{4}-\d{2}-\d{2}$/.test(r.scadenza || '') ? r.scadenza : '',
        refMode: match ? 'existing' : 'new',
        refId: match ? match.id : '',
        newRef: { name: r.nome_prodotto || r.descrizione || '', unit: 'liquido', codice: r.codice_prodotto || '' },
        qtyLt: qtyLt,
        qtyKg: qtyKg,
        density: matchDensity !== null ? matchDensity : '',
        grade: match && match.grade !== null && match.grade !== undefined ? match.grade : ''
      };
    });
    if (!lines.length){ showToast('Non ho trovato righe di prodotto in questa fattura.'); return; }
    state.invoiceReview = { supplierName: result.fornitore || null, lines: lines };
    renderInvoiceReviewModal();
  }
  function closeInvoiceReviewModal(){
    state.invoiceReview = null;
    document.getElementById('invoiceModalOverlay').hidden = true;
    document.getElementById('invoiceModalOverlay').innerHTML = '';
  }
  function renderInvoiceReviewModal(){
    var overlay = document.getElementById('invoiceModalOverlay');
    var rev = state.invoiceReview;

  }
  function renderInvoiceLine(line, idx){
    var ref = line.refMode === 'existing' ? referenceById(line.refId) : null;
    var unit = line.refMode === 'new' ? line.newRef.unit : (ref ? ref.unit : 'liquido');

    html += '<label class="invoice-line-check"><input type="checkbox" data-action="inv-toggle-include" data-idx="' + idx + '"' + (line.include ? ' checked' : '') + '> Includi</label>';

    html += '<div class="invoice-raw">In fattura: ' + escapeHtml(line.rawDescription) + (line.extractedUnit ? ' · unità: ' + escapeHtml(line.extractedUnit) : '') + (line.extractedCode ? ' · codice: ' + escapeHtml(line.extractedCode) : '') + '</div>';

    if (!line.include){ html += '</div>'; return html; }

    html += fieldSelect('invRef_' + idx, 'Referenza', [{ value:'__new__', label:'+ Nuova: ' + (line.extractedName || 'referenza') }]
      .concat(state.references.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'it'); }).map(function(r){ return { value:r.id, label:r.name }; })),
      line.refMode === 'existing' ? line.refId : '__new__');

    if (line.refMode === 'new'){
      html += fieldInput('invNewName_' + idx, 'Nome nuova referenza', 'text', line.newRef.name, '');
      html += fieldInput('invNewCodice_' + idx, 'Codice prodotto (opzionale)', 'text', line.newRef.codice, '');
      html += '<div class="field"><label>Tipo</label><div class="seg">';
      html += '<button type="button" class="seg-btn' + (unit==='liquido'?' active':'') + '" data-action="inv-set-unit" data-idx="' + idx + '" data-unit="liquido">Liquido</button>';
      html += '<button type="button" class="seg-btn' + (unit==='solido'?' active':'') + '" data-action="inv-set-unit" data-idx="' + idx + '" data-unit="solido">Solido</button>';

    }

    html += '<div class="row-split">';
    html += '<div class="field"><label for="invLotto_' + idx + '">Lotto</label><input type="text" id="invLotto_' + idx + '" value="' + escapeHtml(line.lotto) + '"></div>';
    html += '<div class="field"><label for="invScadenza_' + idx + '">Scadenza (opzionale)</label><input type="date" id="invScadenza_' + idx + '" value="' + escapeHtml(line.scadenza) + '"></div>';

    }

    html += '</div>';
    return html;
  }

  function handleInvoiceLineQtyInput(idx, fieldKind){
    var line = state.invoiceReview.lines[idx];
    if (!line) return;
    var lt = document.getElementById('invLt_' + idx);
    var kg = document.getElementById('invKg_' + idx);
    var dens = document.getElementById('invDensity_' + idx);
    var density = numOrNull(dens.value);
    if (fieldKind === 'lt'){
      line.qtyLt = lt.value;
      var ltVal = numOrNull(lt.value);
      if (density !== null && ltVal !== null){ var k = round(ltVal * density, 3); kg.value = k; line.qtyKg = k; }
    } else if (fieldKind === 'kg'){
      line.qtyKg = kg.value;
      var kgVal = numOrNull(kg.value);
      if (density !== null && kgVal !== null){ var l = round(kgVal / density, 3); lt.value = l; line.qtyLt = l; }
    } else if (fieldKind === 'density'){
      line.density = dens.value;
      var ltVal3 = numOrNull(lt.value);
      var kgVal3 = numOrNull(kg.value);
      if (density !== null && ltVal3 !== null){ var k2 = round(ltVal3 * density, 3); kg.value = k2; line.qtyKg = k2; }
      else if (density !== null && kgVal3 !== null){ var l2 = round(kgVal3 / density, 3); lt.value = l2; line.qtyLt = l2; }
    }
  }
  function handleInvoiceLineBlurAutoDensity(idx){
    var line = state.invoiceReview.lines[idx];
    if (!line) return;
    var lt = document.getElementById('invLt_' + idx);
    var kg = document.getElementById('invKg_' + idx);
    var dens = document.getElementById('invDensity_' + idx);
    if (!lt || !kg || !dens) return;
    if (numOrNull(dens.value) !== null) return;
    var ltVal = numOrNull(lt.value);
    var kgVal = numOrNull(kg.value);
    if (ltVal !== null && ltVal > 0 && kgVal !== null){
      var computed = round(kgVal / ltVal, 4);
      dens.value = computed;
      line.density = computed;
    }
  }

  function confirmInvoiceImport(){
    var rev = state.invoiceReview;
    if (!rev) return;
    var included = rev.lines.filter(function(l){ return l.include; });
    if (!included.length){ showToast('Nessuna riga selezionata.'); return; }
    for (var i = 0; i < included.length; i++){
      var l = included[i];
      if (!l.lotto || !l.lotto.trim()){ showToast('Inserisci il lotto per tutte le righe incluse.'); return; }
      var qLt = numOrNull(l.qtyLt), qKg = numOrNull(l.qtyKg);
      if ((!qLt || qLt <= 0) && (!qKg || qKg <= 0)){ showToast('Inserisci una quantità per tutte le righe incluse.'); return; }
      if (l.refMode === 'new' && (!l.newRef.name || !l.newRef.name.trim())){ showToast('Inserisci il nome per le nuove referenze.'); return; }
    }

    var causale = 'Import da fattura' + (rev.supplierName ? ' — ' + rev.supplierName : '');
    var chain = Promise.resolve();
    included.forEach(function(l){
      chain = chain.then(function(){
        var resolveRef;
        if (l.refMode === 'new'){
          var id = uid('ref');
          // Seed the new reference's defaults from this first lot's own
          // density/gradazione, since there is no prior default to use.
          var docData = { name: l.newRef.name.trim(), unit: l.newRef.unit, codice: (l.newRef.codice || '').trim() || null, density: numOrNull(l.density), grade: l.newRef.unit === 'liquido' ? numOrNull(l.grade) : null, notes: null };
          resolveRef = window.__fb.setDoc(REFS_COLL + '/' + id, docData).then(function(){
            var refObj = { id: id, name: docData.name, unit: docData.unit, codice: docData.codice, density: docData.density, grade: docData.grade, notes: docData.notes };
            state.references.push(refObj);
            return refObj;
          });
        } else {
          resolveRef = Promise.resolve(referenceById(l.refId));
        }
        return resolveRef.then(function(ref){
          if (!ref) return;
          return commitCarico(ref, l.lotto.trim(), numOrNull(l.qtyLt), numOrNull(l.qtyKg), numOrNull(l.density), ref.unit === 'liquido' ? numOrNull(l.grade) : null, causale, l.scadenza || null);
        });
      });
    });

    chain.then(function(){
      showToast(included.length + (included.length === 1 ? ' carico registrato' : ' carichi registrati') + ' dalla fattura.');
      closeInvoiceReviewModal();
      state.fattura = freshFatturaDraft();
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Si è verificato un errore durante il caricamento. Controlla le righe e riprova.');
    });
  }

  // ==================================================================
  // CONFIG (categorie, unità di misura, preferenze, colonne): su Firestore
  // ==================================================================
  var CONFIG_DOC = 'log/config_produzione';

    { id:'alcoli',   name:'Alcoli e distillati',        color:'#ff6b6b' },
    { id:'aromi',    name:'Erbe, aromi e infusi',       color:'#4ade80' },
    { id:'zuccheri', name:'Zuccheri e sciroppi',        color:'#ffd166' },
    { id:'acqua',    name:'Acqua e additivi',           color:'#38bdf8' },
    { id:'imballi',  name:'Imballi e confezionamento',  color:'#c4a1ff' },
    { id:'altro',    name:'Altro',                      color:'#d4d4d4' }
  ];
  var DEFAULT_UNITS = [
    { id:'lt', label:'Lt',  kind:'lt', factor:1,     base:true },
    { id:'ml', label:'ml',  kind:'lt', factor:0.001 },
    { id:'cl', label:'cl',  kind:'lt', factor:0.01 },
    { id:'hl', label:'hl',  kind:'lt', factor:100 },
    { id:'kg', label:'Kg',  kind:'kg', factor:1,     base:true },
    { id:'g',  label:'g',   kind:'kg', factor:0.001 },
    { id:'q',  label:'q',   kind:'kg', factor:100 }
  ];
  var ACCENTS = ['#ffb000', '#00d4ff', '#4ade80', '#ffffff', '#ff5ccb', '#ff7a45'];

  function freshConfig(){ return { categories:null, units:null, prefs:{}, grids:{} }; }

  function categories(){ var c = state.config.categories; return (c && c.length) ? c : DEFAULT_CATEGORIES; }
  function categoryById(id){ return categories().filter(function(c){ return c.id === id; })[0] || null; }
  function unitsList(){
    var u = state.config.units;
    var list = (u && u.length) ? u.slice() : DEFAULT_UNITS.slice();
    ['lt','kg'].forEach(function(b){
      if (!list.some(function(x){ return x.id === b; })) list.unshift(DEFAULT_UNITS.filter(function(x){ return x.id === b; })[0]);
    });
    return list;
  }
  function unitById(id){ return unitsList().filter(function(u){ return u.id === id; })[0] || null; }
  function baseUnitId(refType){ return refType === 'liquido' ? 'lt' : 'kg'; }
  function refUm(ref){ return (ref && ref.um && unitById(ref.um)) || unitById(baseUnitId(ref ? ref.unit : 'liquido')); }

  // Converte una quantità tra due unità; fra volume e massa serve la densità (kg/Lt).
  function convertQty(value, fromId, toId, density){
    var f = unitById(fromId), t = unitById(toId);
    if (!f || !t || value === null || value === undefined || isNaN(value)) return null;
    var base = value * f.factor;
    if (f.kind !== t.kind){
      if (!density) return null;
      base = f.kind === 'lt' ? base * density : base / density;
    }
    return base / t.factor;
  }

  function mergeInto(target, patch){
    Object.keys(patch).forEach(function(k){
      var v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v)){
        if (!target[k] || typeof target[k] !== 'object' || Array.isArray(target[k])) target[k] = {};
        mergeInto(target[k], v);
      } else target[k] = v;
    });
  }
  var cfgTimer = null, cfgPending = null;
  function saveConfig(patch){
    mergeInto(state.config, patch);
    cfgPending = cfgPending || {};
    mergeInto(cfgPending, patch);
    clearTimeout(cfgTimer);
    cfgTimer = setTimeout(flushConfig, 500);
  }
  function flushConfig(){
    clearTimeout(cfgTimer); cfgTimer = null;
    if (!cfgPending || !window.__fb) return;
    var p = cfgPending; cfgPending = null;
    window.__fb.setDoc(CONFIG_DOC, p, true).catch(function(e){ console.error(e); showToast('Impostazioni non salvate. Controlla la connessione.'); });
  }
  function applyPrefs(){
    var p = state.config.prefs || {};
    var root = document.documentElement;
    root.style.fontSize = (p.fs || 16) + 'px';
    root.style.setProperty('--accent', p.accent || '#ffb000');
    root.style.setProperty('--rowpad', { compact:'.18rem', normal:'.42rem', wide:'.75rem' }[p.density || 'normal']);
  }

  // ==================================================================
  // GRIGLIA generica (colonne ordinabili/ridimensionabili/nascoste, gruppi, totali)
  // ==================================================================
  var gridDefs = {};      // gid -> colonne (per il selettore colonne)
  var gridOrder = {};     // gid -> id righe nell'ordine visualizzato
  var lastRowClick = { gid:null, id:null, t:0 };
  var gridSortNow = {};

  function gridPrefs(gid, cols){
    var g = (state.config.grids && state.config.grids[gid]) || {};
    var byId = {}; cols.forEach(function(c){ byId[c.id] = c; });
    var order = (g.cols && g.cols.length) ? g.cols.filter(function(id){ return byId[id]; }) : [];
    if (!order.length) order = cols.filter(function(c){ return c.def !== false; }).map(function(c){ return c.id; });
    return { order: order, widths: g.widths || {}, sort: g.sort || null, group: g.group === undefined ? true : g.group };
  }

  function cellText(c, r){
    if (c.html) return c.html(r);
    var v = c.val ? c.val(r) : '';
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number') return fmt(v, c.dec === undefined ? 3 : c.dec);
    return escapeHtml(v);
  }

  function compareVals(a, b){
    var an = (a === null || a === undefined || a === '');
    var bn = (b === null || b === undefined || b === '');
    if (an && bn) return 0;
    if (an) return 1;
    if (bn) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return String(a).localeCompare(String(b), 'it', { numeric:true, sensitivity:'base' });
  }

  function renderGrid(o){
    var gid = o.gid;
    gridDefs[gid] = o.columns;
    var P = gridPrefs(gid, o.columns);
    var byId = {}; o.columns.forEach(function(c){ byId[c.id] = c; });
    var cols = P.order.map(function(id){ return byId[id]; });
    var q = (state.search[gid] || '').trim().toLowerCase();
    var rows = o.rows.slice();
    if (q) rows = rows.filter(function(r){ return (o.searchText ? o.searchText(r) : '').toLowerCase().indexOf(q) !== -1; });

    var sort = P.sort || o.defaultSort || { id: cols[0].id, dir:'asc' };
    var sc = byId[sort.id] || cols[0];
    gridSortNow[gid] = { id: sc.id, dir: sort.dir };
    var dirMul = sort.dir === 'desc' ? -1 : 1;
    rows.sort(function(a, b){
      var av = sc.val ? sc.val(a) : null, bv = sc.val ? sc.val(b) : null;
      var an = (av === null || av === undefined || av === ''), bn = (bv === null || bv === undefined || bv === '');
      if (an || bn) return compareVals(av, bv);
      return compareVals(av, bv) * dirMul;
    });

    var grouped = !!(o.groupBy && P.group);
    var groups = [];
    if (grouped){
      var map = {};
      rows.forEach(function(r){
        var g = o.groupBy(r);
        if (!map[g.key]){ map[g.key] = { key:g.key, label:g.label, color:g.color, order:g.order, rows:[] }; groups.push(map[g.key]); }
        map[g.key].rows.push(r);
      });
      groups.sort(function(a, b){ return (a.order - b.order) || a.label.localeCompare(b.label, 'it'); });
    } else groups = [{ key:'', rows: rows }];

    var visibleIds = [];
    groups.forEach(function(g){
      if (grouped && state.collapsed[gid + ':' + g.key]) return;
      g.rows.forEach(function(r){ visibleIds.push(o.rowId(r)); });
    });
    gridOrder[gid] = visibleIds;
    if (state.sel[gid] && !rows.some(function(r){ return o.rowId(r) === state.sel[gid]; })) state.sel[gid] = null;
    var selRow = state.sel[gid] ? rows.filter(function(r){ return o.rowId(r) === state.sel[gid]; })[0] : null;

    function sums(list){
      var out = [];
      cols.forEach(function(c){
        if (!c.sum) return;
        var t = 0, any = false;
        list.forEach(function(r){ var v = c.val(r); if (typeof v === 'number'){ t += v; any = true; } });
        if (any) out.push({ c:c, v:t });
      });
      return out;
    }

    var html = '<div class="gv">';
    // barra comandi
    html += '<div class="grid-toolbar">';
    (o.actions || []).forEach(function(a){
      var dis = (a.needSel && !selRow) ? ' disabled' : '';
      var attrs = (a.needSel && selRow) ? (a.attrs ? a.attrs(selRow) : ' data-id="' + escapeHtml(o.rowId(selRow)) + '"') : '';
      html += '<button type="button" class="btn btn-sm ' + (a.cls || 'btn-ghost') + '" data-action="' + a.action + '"' + attrs + dis + '>' + a.label + (a.key ? ' <small style="opacity:.7">' + a.key + '</small>' : '') + '</button>';
    });
    if (o.searchText){
      html += '<input type="search" data-gsearch="' + gid + '" placeholder="Cerca…  (F3)" value="' + escapeHtml(state.search[gid] || '') + '">';
    }
    html += o.filtersHtml || '';
    html += '<span class="gt-spacer"></span>';
    html += '<span class="gt-count">' + rows.length + (rows.length === 1 ? ' riga' : ' righe') + '</span>';
    if (o.groupBy) html += '<button type="button" class="btn btn-sm btn-ghost" data-action="grid-group" data-grid="' + gid + '">' + (P.group ? 'Togli raggruppamento' : 'Raggruppa per categoria') + '</button>';
    html += '<button type="button" class="btn btn-sm btn-ghost" data-action="grid-cols" data-grid="' + gid + '">Colonne…</button>';
    html += '</div>';

    // tabella
    var total = 0;
    var widths = cols.map(function(c){ var w = P.widths[c.id] || c.w || 120; total += w; return w; });
    html += '<div class="grid-wrap"><table class="grid" data-grid="' + gid + '" style="width:' + total + 'px"><colgroup>';
    widths.forEach(function(w, i){ html += '<col data-col="' + cols[i].id + '" style="width:' + w + 'px">'; });
    html += '</colgroup><thead><tr>';
    cols.forEach(function(c){
      var ind = (sc.id === c.id) ? '<span class="sort-ind">' + (dirMul === 1 ? '▲' : '▼') + '</span>' : '';
      html += '<th class="' + (c.num ? 'num' : '') + '" data-action="grid-sort" data-grid="' + gid + '" data-col="' + c.id + '" title="Clic per ordinare">' + escapeHtml(c.label) + ind + '<span class="col-resize" data-resize="' + c.id + '" data-grid="' + gid + '"></span></th>';
    });
    html += '</tr></thead><tbody>';
    if (!rows.length){
      html += '<tr><td colspan="' + cols.length + '" style="text-align:center;color:var(--muted);padding:2rem;white-space:normal;">' + (o.emptyMsg || 'Nessun elemento.') + '</td></tr>';
    }
    groups.forEach(function(g){
      var collapsed = grouped && state.collapsed[gid + ':' + g.key];
      if (grouped){
        var s = sums(g.rows).map(function(x){ return escapeHtml(x.c.label) + ': ' + fmt(x.v, x.c.dec === undefined ? 3 : x.c.dec); }).join(' · ');
        html += '<tr class="grp" data-action="grid-grp" data-grid="' + gid + '" data-key="' + escapeHtml(g.key) + '"><td colspan="' + cols.length + '">' + (collapsed ? '▸ ' : '▾ ') +
          '<span class="cat-dot" style="background:' + (g.color || '#888') + '"></span>' + escapeHtml(g.label) + ' <span style="color:var(--muted);font-weight:500;">(' + g.rows.length + ')' + (s ? ' — ' + s : '') + '</span></td></tr>';
        if (collapsed) return;
      }
      g.rows.forEach(function(r){
        var id = o.rowId(r);
        html += '<tr class="grow' + (state.sel[gid] === id ? ' sel' : '') + (o.rowClass ? ' ' + (o.rowClass(r) || '') : '') + '" data-grid="' + gid + '" data-grow="' + escapeHtml(id) + '">';
        cols.forEach(function(c){ html += '<td class="' + (c.num ? 'num' : '') + '">' + cellText(c, r) + '</td>'; });
        html += '</tr>';
      });
    });
    html += '</tbody>';
    var tot = sums(rows);
    if (tot.length){
      html += '<tfoot><tr>';
      cols.forEach(function(c, i){
        var t = tot.filter(function(x){ return x.c.id === c.id; })[0];
        html += '<td class="' + (c.num ? 'num' : '') + '">' + (t ? fmt(t.v, c.dec === undefined ? 3 : c.dec) : (i === 0 ? 'Totale' : '')) + '</td>';
      });
      html += '</tr></tfoot>';
    }
    html += '</table></div>';
    if (o.detail) html += o.detail(selRow);
    html += '</div>';
    return html;
  }

  function selectRow(gid, id, fromClick){
    var now = Date.now();
    var dbl = fromClick && lastRowClick.gid === gid && lastRowClick.id === id && (now - lastRowClick.t) < 450;
    lastRowClick = { gid:gid, id:id, t:now };

  function renderStatusBar(){

    state.references.forEach(function(r){ if (refStatus(r).cls === 'bad' && refStatus(r).label === 'Sotto scorta') low++; });
    state.lots.filter(hasStock).forEach(function(l){
      var e = expiryStatus(l.scadenza);
      if (e.cls === 'expired') expired++; else if (e.cls === 'soon') soon++;
    });
    var left = '<span><b>' + state.references.length + '</b> materie prime · <b>' + state.lots.filter(hasStock).length + '</b> lotti in giacenza · <b>' + state.recipes.length + '</b> prodotti finiti</span>';

    if (expired) alerts.push('<span class="st-bad">' + expired + ' lotti scaduti</span>');
    if (soon) alerts.push('<span class="st-warn">' + soon + ' in scadenza (30 gg)</span>');
    if (low) alerts.push('<span class="st-warn">' + low + ' sotto scorta</span>');
    document.getElementById('statusbar').innerHTML = '<span>' + left + (alerts.length ? ' · ' + alerts.join(' · ') : '') + '</span><span>F1 scorciatoie · F2 modifica · F3 cerca · F4 nuovo · Canc elimina · doppio clic apre</span>';

  function updateConvResult(){
    var el = document.getElementById('convResult');
    if (!el) return;
    var d = state.toolModal.draft;
    var dens = numOrNull(d.density);
    if (d.refId){ var r = referenceById(d.refId); if (r && r.density) dens = r.density; }
    var v = numOrNull(d.value);
    var res = convertQty(v, d.from, d.to, dens);
    var tu = unitById(d.to), fu = unitById(d.from);
    if (v === null) el.textContent = '—';
    else if (res === null) el.textContent = 'Serve la densità per convertire da ' + (fu ? fu.label : '') + ' a ' + (tu ? tu.label : '');
    else el.textContent = fmt(v, 4) + ' ' + fu.label + ' = ' + fmt(res, 4) + ' ' + tu.label;
  }

  function saveToolModal(){
    var m = state.toolModal;
    if (m.kind === 'categorie'){
      var cats = [];
      for (var i = 0; i < m.draft.length; i++){
        var c = m.draft[i];
        var nm = (c.name || '').trim();
        if (!nm){ showToast('Ogni categoria deve avere un nome.'); return; }
        cats.push({ id: c.id || uid('cat'), name: nm, color: c.color });
      }
      saveConfig({ categories: cats });
    } else if (m.kind === 'unita'){
      var list = [], seen = {};
      for (var j = 0; j < m.draft.length; j++){
        var u = m.draft[j];
        var lab = (u.label || '').trim();
        var f = parseFloat(String(u.factor).replace(',', '.'));
        if (!lab){ showToast('Ogni unità deve avere un nome.'); return; }
        if (!(f > 0)){ showToast('Il fattore di «' + lab + '» deve essere maggiore di zero.'); return; }
        if (seen[lab.toLowerCase()]){ showToast('Nome duplicato: «' + lab + '».'); return; }
        seen[lab.toLowerCase()] = true;
        var o = { id: u.id || uid('um'), label: lab, kind: u.kind, factor: f };
        if (u.base) o.base = true;
        list.push(o);
      }
      saveConfig({ units: list });
    }
    flushConfig();
    showToast('Salvato.');
    closeTool();
  }

  // ---------- eventi dei moduli strumenti ----------
  function handleToolInput(t){
    var m = state.toolModal;
    if (!m) return false;
    if (t.hasAttribute('data-tcat')){ m.draft[+t.getAttribute('data-tcat')][t.getAttribute('data-tf')] = t.value; return true; }
    if (t.hasAttribute('data-tun')){ m.draft[+t.getAttribute('data-tun')][t.getAttribute('data-tf')] = t.value; return true; }
    if (m.kind === 'conv'){
      if (t.id === 'convValue') m.draft.value = t.value;
      else if (t.id === 'convFrom') m.draft.from = t.value;
      else if (t.id === 'convTo') m.draft.to = t.value;
      else if (t.id === 'convDensity') m.draft.density = t.value;
      else if (t.id === 'convRef') m.draft.refId = t.value;
      else return false;
      updateConvResult();
      return true;
    }
    return false;
  }

  // ==================================================================
  // Helper di dominio
  // ==================================================================
  function hasStock(l){ return (l.qtyLt || 0) > 0.0005 || (l.qtyKg || 0) > 0.0005; }
  function stockLots(refId){ return lotsForRef(refId).filter(hasStock); }
  function sortRefs(list){ return list.slice().sort(function(a, b){ return a.name.localeCompare(b.name, 'it', { sensitivity:'base' }); }); }
  function groupOfCategory(catId){
    var c = catId ? categoryById(catId) : null;
    if (!c) return { key:'_none', label:'Senza categoria', color:'#8a8a8a', order:999 };
    return { key:c.id, label:c.name, color:c.color, order:categories().indexOf(c) };
  }
  function catHtml(catId){
    var c = catId ? categoryById(catId) : null;
    return c ? '<span class="cat-dot" style="background:' + c.color + '"></span>' + escapeHtml(c.name) : '<span style="color:var(--muted)">—</span>';
  }
  function stockInUm(ref){
    var t = totalStock(ref.id);
    var um = refUm(ref);
    var base = um.kind === 'lt' ? t.lt : t.kg;
    if (base === null){
      var other = um.kind === 'lt' ? t.kg : t.lt;
      if (other !== null && ref.density) base = um.kind === 'lt' ? other / ref.density : other * ref.density;
    }
    return base === null ? null : round(base / um.factor, 3);
  }
  function refAnidri(refId){
    var t = 0, any = false;
    stockLots(refId).forEach(function(l){
      if (l.qtyLt && l.grade !== null && l.grade !== undefined){ t += l.qtyLt * l.grade / 100; any = true; }
    });
    return any ? round(t, 3) : null;
  }
  function nextExpiry(refId){
    var ds = stockLots(refId).map(function(l){ return l.scadenza; }).filter(Boolean).sort();
    return ds[0] || null;
  }
  function refStatus(r){
    var lots = stockLots(r.id);
    if (!lots.length) return { label:'Esaurita', cls:'warn' };
    var exps = lots.map(function(l){ return expiryStatus(l.scadenza).cls; });
    if (exps.indexOf('expired') !== -1) return { label:'Scaduto', cls:'bad' };
    var min = numOrNull(r.minQty), st = stockInUm(r);
    if (min !== null && st !== null && st < min) return { label:'Sotto scorta', cls:'bad' };
    if (exps.indexOf('soon') !== -1) return { label:'In scadenza', cls:'warn' };
    return { label:'OK', cls:'ok' };
  }
  function tagHtml(s){ return '<span class="tag ' + s.cls + '">' + s.label + '</span>'; }
  function expHtml(scad){
    var e = expiryStatus(scad);
    return e.label ? '<span class="expiry-tag ' + e.cls + '">' + e.label + '</span>' : '—';
  }
  function dateVal(iso){ return iso || null; }
  function refOptionsHtml(selected, filterFn){
    var html = '<option value="">— Seleziona —</option>';
    var refs = sortRefs(state.references.filter(filterFn || function(){ return true; }));
    var groups = {};
    refs.forEach(function(r){ var g = groupOfCategory(r.category); (groups[g.key] = groups[g.key] || { g:g, items:[] }).items.push(r); });
    Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a, b){ return a.g.order - b.g.order; }).forEach(function(x){
      html += '<optgroup label="' + escapeHtml(x.g.label) + '">';
      x.items.forEach(function(r){ html += '<option value="' + r.id + '"' + (r.id === selected ? ' selected' : '') + '>' + escapeHtml(r.name) + (r.unit === 'solido' ? ' (solido)' : '') + '</option>'; });
      html += '</optgroup>';
    });
    return html;
  }
  function catFilterHtml(id, value){
    var html = '<select id="' + id + '"><option value="">Tutte le categorie</option>';
    categories().forEach(function(c){ html += '<option value="' + c.id + '"' + (value === c.id ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>'; });
    html += '<option value="_none"' + (value === '_none' ? ' selected' : '') + '>Senza categoria</option></select>';
    return html;
  }
  function catMatches(catId, filter){
    if (!filter) return true;
    if (filter === '_none') return !(catId && categoryById(catId));
    return catId === filter;
  }
  function lotsDetailTable(lots, withRef){
    var h = '<table><thead><tr>' + (withRef ? '<th>Materia prima</th>' : '') + '<th>Lotto</th><th>Scadenza</th><th style="text-align:right">Lt</th><th style="text-align:right">Kg</th><th style="text-align:right">Densità</th><th style="text-align:right">Gradaz.</th><th style="text-align:right">Lt anidri</th><th></th></tr></thead><tbody>';
    lots.forEach(function(l){
      var e = expiryStatus(l.scadenza);
      h += '<tr class="' + (e.cls === 'expired' ? 'expired' : '') + '">' + (withRef ? '<td>' + escapeHtml(l.refName) + '</td>' : '') +

  function expiryStatus(scadenza){
    if (!scadenza) return { label: '', cls: '' };
    var d = new Date(scadenza + 'T00:00:00');
    if (isNaN(d.getTime())) return { label: scadenza, cls: '' };
    var today = new Date(); today.setHours(0,0,0,0);
    var diffDays = Math.round((d - today) / 86400000);
    var label = d.toLocaleDateString('it-IT');
    if (diffDays < 0) return { label: label + ' (scaduto)', cls: 'expired' };
    if (diffDays <= 30) return { label: label + ' (' + diffDays + 'g)', cls: 'soon' };
    return { label: label, cls: '' };
  }

  function recipeCalc(r){
    var anidri = 0, hasAny = false;
    (r.components || []).forEach(function(c){
      var ref = referenceById(c.refId);
      if (!ref || ref.unit !== 'liquido' || ref.grade === null || ref.grade === undefined) return;
      if (c.doseLt === null || c.doseLt === undefined) return;
      anidri += c.doseLt * ref.grade / 100;
      hasAny = true;
    });
    anidri = hasAny ? round(anidri, 3) : null;
    var gradeTheoretical = (anidri !== null && r.baseLt) ? round(anidri / r.baseLt * 100, 2) : null;
    return { anidri: anidri, gradeTheoretical: gradeTheoretical };
  }

    if (!ref || v === null) return null;
    var um = c.um || refUm(ref).id;
    return convertQty(v, um, baseUnitId(ref.unit), ref.density);
  }
  function mergedDraftRecipe(d){
    return {
      baseLt: numOrNull(d.baseLt) || 1,
      components: d.components.filter(function(c){ return c.refId; }).map(function(c){
        var ref = referenceById(c.refId), b = draftDoseBase(c);
        return { refId: c.refId, doseLt: ref && ref.unit === 'liquido' ? b : null, doseKg: ref && ref.unit === 'solido' ? b : null };
      })
    };
  }

  function applyQtyUm(row){
    var q = numOrNull(row.qty), u = unitById(row.um);
    if (q === null || !u){ if (q === null && row.qty === '') { /* nulla da derivare */ } return; }
    var base = q * u.factor, dens = numOrNull(row.density);
    if (u.kind === 'lt'){ row.lt = round(base, 3); row.kg = dens ? round(base * dens, 3) : ''; }
    else { row.kg = round(base, 3); row.lt = dens ? round(base / dens, 3) : ''; }
  }

  function updateCaricoTotals(){

  function syncCaricoRowDom(i, skip){

  function handleCaricoRowInput(el){
    var i = parseInt(el.getAttribute('data-crow'), 10), f = el.getAttribute('data-cfield');
    var row = state.carico.rows[i];
    if (!row) return;
    row[f] = el.value;
    var dens = numOrNull(row.density), lt = numOrNull(row.lt), kg = numOrNull(row.kg);
    if (f === 'qty' || f === 'um'){
      if (row.qty === ''){ row.lt = ''; row.kg = ''; } else applyQtyUm(row);
    } else if (f === 'lt'){
      row.qty = '';
      row.kg = (dens && lt !== null) ? round(lt * dens, 3) : (dens ? '' : row.kg);
    } else if (f === 'kg'){
      row.qty = '';
      row.lt = (dens && kg !== null) ? round(kg / dens, 3) : (dens ? '' : row.lt);
    } else if (f === 'density'){
      if (dens && lt !== null) row.kg = round(lt * dens, 3);
      else if (dens && kg !== null) row.lt = round(kg / dens, 3);
    }
    syncCaricoRowDom(i, f);

  // Densità derivata solo a fine digitazione (non a ogni tasto), altrimenti un numero a metà blocca un valore sbagliato.

    if (!row) return;
    if (f === 'lt' || f === 'kg'){

  function lotsByExpiry(refId){
    return stockLots(refId).sort(function(a, b){ return (a.scadenza || '9999').localeCompare(b.scadenza || '9999'); });

  function setScaricoRef(row, refId, lotId){

  // Converte la richiesta nell'unità del lotto e verifica la disponibilità (su copie simulate, per più righe sullo stesso lotto).
  function resolveScarico(row, sim){
    var ref = referenceById(row.refId), real = lotById(row.lotId);
    var q = numOrNull(row.qty), um = unitById(row.um);
    if (!ref || !real || q === null || q <= 0 || !um) return { incomplete:true };
    var lot = sim[real.id] = sim[real.id] || Object.assign({}, real);
    var unit = um.kind, qty = q * um.factor;
    var native = unit === 'lt' ? lot.qtyLt : lot.qtyKg;
    if ((native === null || native === undefined) && lot.density){
      if (unit === 'lt'){ unit = 'kg'; qty = qty * lot.density; } else { unit = 'lt'; qty = qty / lot.density; }
    }
    qty = round(qty, 3);
    var avail = availableQty(lot, unit);
    if (qty > avail + 0.0005) return { err:'disponibili solo ' + fmt(avail, 3) + ' ' + (unit === 'lt' ? 'Lt' : 'Kg') + ' nel lotto ' + real.lotto + '.' };
    return { ref:ref, real:real, simLot:lot, unit:unit, qty:qty };
  }
  function scaricoEquivText(row){
    var res = resolveScarico(row, {});
    if (res.incomplete) return '—';
    if (res.err) return '<span class="alloc-bad">' + escapeHtml(res.err) + '</span>';
    var other = '';
    var lot = res.real;
    if (lot.density) other = res.unit === 'lt' ? ' (≈ ' + fmt(res.qty * lot.density, 3) + ' Kg)' : ' (≈ ' + fmt(res.qty / lot.density, 3) + ' Lt)';
    return '<span class="alloc-ok">' + fmt(res.qty, 3) + ' ' + (res.unit === 'lt' ? 'Lt' : 'Kg') + '</span>' + other;
  }

  function saveScarico(){
    var d = state.scarico, sim = {}, items = [];
    var causale = d.causale.trim();
    for (var i = 0; i < d.rows.length; i++){
      var row = d.rows[i];
      if (!row.refId && !row.lotId && !row.qty) continue;
      var res = resolveScarico(row, sim);
      if (res.incomplete){ showToast('Riga ' + (i + 1) + ': scegli materia prima, lotto e quantità.'); return; }
      if (res.err){ showToast('Riga ' + (i + 1) + ': ' + res.err); return; }
      var upd = consumeFromLot(res.simLot, res.qty, res.unit);
      res.simLot.qtyLt = upd.qtyLt; res.simLot.qtyKg = upd.qtyKg;
      items.push(res);
    }
    if (!items.length){ showToast('Compila almeno una riga.'); return; }
    var chain = Promise.resolve();
    items.forEach(function(it){
      chain = chain.then(function(){
        var lot = it.real;
        var updated = consumeFromLot(lot, it.qty, it.unit);
        lot.qtyLt = updated.qtyLt; lot.qtyKg = updated.qtyKg;
        return window.__fb.setDoc(LOTS_COLL + '/' + lot.id, { qtyLt: updated.qtyLt, qtyKg: updated.qtyKg, updatedAt: new Date().toISOString() }, true).then(function(){
          logProdMovement({ type:'scarico', refId: it.ref.id, refName: it.ref.name, lotto: lot.lotto, unit: it.unit, delta: -it.qty, causale: causale || null });
        });
      });
    });
    chain.then(function(){
      showToast(items.length === 1 ? 'Scarico registrato: -' + fmt(items[0].qty, 3) + ' ' + (items[0].unit === 'lt' ? 'Lt' : 'Kg') + '.' : items.length + ' scarichi registrati.');
