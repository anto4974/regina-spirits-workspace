  // ---------- matching riga fattura -> referenza esistente ----------
  function normalizeForMatch(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // Two tokens count as "the same word" if identical, or if one is a
  // (reasonably long) prefix of the other - catches plurals and abbreviated
  // endings ("etilico" / "etil.") without treating any short common word as
  // a match on its own.
  function tokensMatch(a, b){
    if (a === b) return true;
    if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
    return false;
  }
  function guessReferenceMatch(name){
    var norm = normalizeForMatch(name);
    if (!norm) return null;
    var normTokens = norm.split(' ').filter(Boolean);
    var best = null, bestScore = 0;
    state.references.forEach(function(r){
      var rNorm = normalizeForMatch(r.name);
      if (!rNorm) return;
      if (rNorm === norm){
        if (100 > bestScore){ bestScore = 100; best = r; }
        return;
      }
      var rTokens = rNorm.split(' ').filter(Boolean);
      var minLen = Math.min(normTokens.length, rTokens.length);
      // A single shared word (e.g. an existing reference literally called
      // "Zucchero") is not enough evidence on its own - require at least two
      // meaningful words on the shorter side before counting partial overlap,
      // and near-full coverage of it. A wrong auto-match silently mixes two
      // different products' stock, which is worse than asking the user to
      // pick manually - so when in doubt, this returns no match ("new").
      if (minLen < 2) return;
      var matchedCount = rTokens.filter(function(rt){
        return normTokens.some(function(nt){ return tokensMatch(nt, rt); });
      }).length;
      var overlapRatio = matchedCount / minLen;
      if (overlapRatio >= 0.8 && matchedCount >= 2){
        var score = 70 + overlapRatio * 20;
        if (score > bestScore){ bestScore = score; best = r; }
      }
    });
    return bestScore >= 70 ? best : null;
  }
  function guessQtyFromUnit(unitStr, quantity){
    var out = { qtyLt: '', qtyKg: '' };
    if (quantity === null || quantity === undefined || isNaN(quantity)) return out;
    var u = normalizeForMatch(unitStr);
    if (/^(kg|chilogramm|chilo)/.test(u)) out.qtyKg = quantity;
    else if (/^(l|lt|litr)/.test(u)) out.qtyLt = quantity;
    else if (/^(g|gr|grammi|grammo)/.test(u)) out.qtyKg = round(quantity / 1000, 3);
    else if (/^(ml|millilitri)/.test(u)) out.qtyLt = round(quantity / 1000, 3);
    return out;
  }

  // ==================================================================
  // MODAL: revisione righe fattura
  // ==================================================================
  // A shared product code is unambiguous even when the invoice's wording
  // doesn't resemble the saved name at all - it always wins over the
  // name-similarity guess.
  function guessReferenceMatchByCode(code){
    var norm = String(code || '').trim().toLowerCase();
    if (!norm) return null;
    for (var i = 0; i < state.references.length; i++){
      var r = state.references[i];
      if (r.codice && String(r.codice).trim().toLowerCase() === norm) return r;
    }
    return null;
  }
  function openInvoiceReviewModal(result){
    var righe = result.righe || [];
    var lines = righe.map(function(r){
      var match = guessReferenceMatchByCode(r.codice_prodotto) || guessReferenceMatch(r.nome_prodotto || r.descrizione);
      var qtyGuess = guessQtyFromUnit(r.unita, r.quantita);
      var matchDensity = match && match.density !== null && match.density !== undefined ? match.density : null;
      // The invoice only ever states one unit (e.g. "25 L"); when the
      // matched product's density is already known, fill in the other side
      // immediately so the reviewer sees both, not just whichever the
      // invoice happened to print.
      var qtyLt = qtyGuess.qtyLt, qtyKg = qtyGuess.qtyKg;
      if (matchDensity){
        if (qtyLt !== '' && qtyKg === '') qtyKg = round(qtyLt * matchDensity, 3);
        else if (qtyKg !== '' && qtyLt === '') qtyLt = round(qtyKg / matchDensity, 3);
      }
      return {
        include: true,
        rawDescription: r.descrizione || '',
        extractedName: r.nome_prodotto || r.descrizione || '',
        extractedUnit: r.unita || '',
        extractedCode: r.codice_prodotto || '',
        lotto: r.lotto || '',
        refMode: match ? 'existing' : 'new',
        refId: match ? match.id : '',
        newRef: { name: r.nome_prodotto || r.descrizione || '', unit: 'liquido', codice: r.codice_prodotto || '' },
        qtyLt: qtyLt,
        qtyKg: qtyKg,
        density: matchDensity !== null ? matchDensity : '',
        grade: match && match.grade !== null && match.grade !== undefined ? match.grade : ''
      };
    });
    if (!lines.length){ showToast('Non ho trovato righe di prodotto in questa fattura.'); return; }
    state.invoiceReview = { supplierName: result.fornitore || null, lines: lines };
    renderInvoiceReviewModal();
  }
  function closeInvoiceReviewModal(){
    state.invoiceReview = null;
    document.getElementById('invoiceModalOverlay').hidden = true;
    document.getElementById('invoiceModalOverlay').innerHTML = '';
  }
  function renderInvoiceReviewModal(){
    var overlay = document.getElementById('invoiceModalOverlay');
    var rev = state.invoiceReview;
    if (!rev){ overlay.hidden = true; return; }
    var html = '<div class="modal-sheet" style="max-width:640px;">';
    html += '<h2 class="modal-title">Revisione fattura</h2>';
    html += '<p class="modal-subtitle">' + (rev.supplierName ? 'Fornitore: ' + escapeHtml(rev.supplierName) + ' — ' : '') + 'controlla ogni riga prima di registrare i carichi.</p>';
    rev.lines.forEach(function(line, idx){ html += renderInvoiceLine(line, idx); });
    var includedCount = rev.lines.filter(function(l){ return l.include; }).length;
    html += '<div class="btn-row"><button type="button" class="btn btn-ghost" data-action="close-invoice-modal">Annulla</button><button type="button" class="btn btn-good" data-action="confirm-invoice-import">Conferma e carica (' + includedCount + ')</button></div>';
    html += '</div>';
    overlay.innerHTML = html;
    overlay.hidden = false;
  }
  function renderInvoiceLine(line, idx){
    var ref = line.refMode === 'existing' ? referenceById(line.refId) : null;
    var unit = line.refMode === 'new' ? line.newRef.unit : (ref ? ref.unit : 'liquido');
    var html = '<div class="invoice-line" data-line-idx="' + idx + '">';
    html += '<div class="invoice-line-top">';
    html += '<label class="invoice-line-check"><input type="checkbox" data-action="inv-toggle-include" data-idx="' + idx + '"' + (line.include ? ' checked' : '') + '> Includi</label>';
    html += '</div>';
    html += '<div class="invoice-raw">In fattura: ' + escapeHtml(line.rawDescription) + (line.extractedUnit ? ' · unità: ' + escapeHtml(line.extractedUnit) : '') + (line.extractedCode ? ' · codice: ' + escapeHtml(line.extractedCode) : '') + '</div>';

    if (!line.include){ html += '</div>'; return html; }

    html += fieldSelect('invRef_' + idx, 'Referenza', [{ value:'__new__', label:'+ Nuova: ' + (line.extractedName || 'referenza') }]
      .concat(state.references.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'it'); }).map(function(r){ return { value:r.id, label:r.name }; })),
      line.refMode === 'existing' ? line.refId : '__new__');

    if (line.refMode === 'new'){
      html += fieldInput('invNewName_' + idx, 'Nome nuova referenza', 'text', line.newRef.name, '');
      html += fieldInput('invNewCodice_' + idx, 'Codice prodotto (opzionale)', 'text', line.newRef.codice, '');
      html += '<div class="field"><label>Tipo</label><div class="seg">';
      html += '<button type="button" class="seg-btn' + (unit==='liquido'?' active':'') + '" data-action="inv-set-unit" data-idx="' + idx + '" data-unit="liquido">Liquido</button>';
      html += '<button type="button" class="seg-btn' + (unit==='solido'?' active':'') + '" data-action="inv-set-unit" data-idx="' + idx + '" data-unit="solido">Solido</button>';
      html += '</div></div>';
    }

    html += '<div class="field"><label for="invLotto_' + idx + '">Lotto</label><input type="text" id="invLotto_' + idx + '" value="' + escapeHtml(line.lotto) + '"></div>';

    html += '<div class="row-split3">';
    html += fieldInput('invLt_' + idx, 'Quantità (Lt)', 'number', line.qtyLt, 'step="0.001" min="0"');
    html += fieldInput('invKg_' + idx, 'Quantità (Kg)', 'number', line.qtyKg, 'step="0.001" min="0"');
    html += fieldInput('invDensity_' + idx, 'Densità (kg/Lt)', 'number', line.density, 'step="0.0001" min="0"');
    html += '</div>';

    if (unit === 'liquido'){
      html += fieldInput('invGrade_' + idx, 'Gradazione (%) — opzionale', 'number', line.grade, 'step="0.1" min="0" max="100"');
    }

    html += '</div>';
    return html;
  }

  function handleInvoiceLineQtyInput(idx, fieldKind){
    var line = state.invoiceReview.lines[idx];
    if (!line) return;
    var lt = document.getElementById('invLt_' + idx);
    var kg = document.getElementById('invKg_' + idx);
    var dens = document.getElementById('invDensity_' + idx);
    var density = numOrNull(dens.value);
    if (fieldKind === 'lt'){
      line.qtyLt = lt.value;
      var ltVal = numOrNull(lt.value);
      if (density !== null && ltVal !== null){ var k = round(ltVal * density, 3); kg.value = k; line.qtyKg = k; }
    } else if (fieldKind === 'kg'){
      line.qtyKg = kg.value;
      var kgVal = numOrNull(kg.value);
      if (density !== null && kgVal !== null){ var l = round(kgVal / density, 3); lt.value = l; line.qtyLt = l; }
    } else if (fieldKind === 'density'){
      line.density = dens.value;
      var ltVal3 = numOrNull(lt.value);
      var kgVal3 = numOrNull(kg.value);
      if (density !== null && ltVal3 !== null){ var k2 = round(ltVal3 * density, 3); kg.value = k2; line.qtyKg = k2; }
      else if (density !== null && kgVal3 !== null){ var l2 = round(kgVal3 / density, 3); lt.value = l2; line.qtyLt = l2; }
    }
  }
  function handleInvoiceLineBlurAutoDensity(idx){
    var line = state.invoiceReview.lines[idx];
    if (!line) return;
    var lt = document.getElementById('invLt_' + idx);
    var kg = document.getElementById('invKg_' + idx);
    var dens = document.getElementById('invDensity_' + idx);
    if (!lt || !kg || !dens) return;
    if (numOrNull(dens.value) !== null) return;
    var ltVal = numOrNull(lt.value);
    var kgVal = numOrNull(kg.value);
    if (ltVal !== null && ltVal > 0 && kgVal !== null){
      var computed = round(kgVal / ltVal, 4);
      dens.value = computed;
      line.density = computed;
    }
  }

  function confirmInvoiceImport(){
    var rev = state.invoiceReview;
    if (!rev) return;
    var included = rev.lines.filter(function(l){ return l.include; });
    if (!included.length){ showToast('Nessuna riga selezionata.'); return; }
    for (var i = 0; i < included.length; i++){
      var l = included[i];
      if (!l.lotto || !l.lotto.trim()){ showToast('Inserisci il lotto per tutte le righe incluse.'); return; }
      var qLt = numOrNull(l.qtyLt), qKg = numOrNull(l.qtyKg);
      if ((!qLt || qLt <= 0) && (!qKg || qKg <= 0)){ showToast('Inserisci una quantità per tutte le righe incluse.'); return; }
      if (l.refMode === 'new' && (!l.newRef.name || !l.newRef.name.trim())){ showToast('Inserisci il nome per le nuove referenze.'); return; }
    }

    var causale = 'Import da fattura' + (rev.supplierName ? ' — ' + rev.supplierName : '');
    var chain = Promise.resolve();
    included.forEach(function(l){
      chain = chain.then(function(){
        var resolveRef;
        if (l.refMode === 'new'){
          var id = uid('ref');
          // Seed the new reference's defaults from this first lot's own
          // density/gradazione, since there is no prior default to use.
          var docData = { name: l.newRef.name.trim(), unit: l.newRef.unit, codice: (l.newRef.codice || '').trim() || null, density: numOrNull(l.density), grade: l.newRef.unit === 'liquido' ? numOrNull(l.grade) : null, photo: null, notes: null };
          resolveRef = window.__fb.setDoc(REFS_COLL + '/' + id, docData).then(function(){
            var refObj = { id: id, name: docData.name, unit: docData.unit, codice: docData.codice, density: docData.density, grade: docData.grade, photo: docData.photo, notes: docData.notes };
            state.references.push(refObj);
            return refObj;
          });
        } else {
          resolveRef = Promise.resolve(referenceById(l.refId));
        }
        return resolveRef.then(function(ref){
          if (!ref) return;
          return commitCarico(ref, l.lotto.trim(), numOrNull(l.qtyLt), numOrNull(l.qtyKg), numOrNull(l.density), ref.unit === 'liquido' ? numOrNull(l.grade) : null, causale);
        });
      });
    });

    chain.then(function(){
      showToast(included.length + (included.length === 1 ? ' carico registrato' : ' carichi registrati') + ' dalla fattura.');
      closeInvoiceReviewModal();
      state.fattura = freshFatturaDraft();
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Si è verificato un errore durante il caricamento. Controlla le righe e riprova.');
    });
  }

  // ==================================================================
  // event delegation
  // ==================================================================
  function bindGlobalEvents(){
    document.body.addEventListener('click', function(e){
      var el = e.target.closest('[data-action]');
      if (!el) return;
      var action = el.getAttribute('data-action');

      if (action === 'tab'){ state.view = el.getAttribute('data-tab'); state.expandedRef = null; render(); return; }
      if (action === 'new-reference'){ openRefModal('new', null, null); return; }
      if (action === 'edit-reference'){ openRefModal('edit', referenceById(el.getAttribute('data-id')), null); return; }
      if (action === 'close-ref-modal'){ closeRefModal(); return; }
      if (action === 'save-reference'){ saveReference(); return; }
      if (action === 'delete-reference'){ deleteReference(el.getAttribute('data-id')); return; }
      if (action === 'ref-set-unit'){ state.refModal.draft.unit = el.getAttribute('data-unit'); renderRefModal(); return; }
      if (action === 'toggle-lots'){ var id = el.getAttribute('data-id'); state.expandedRef = state.expandedRef === id ? null : id; render(); return; }
      if (action === 'quick-scarico'){ state.scarico = freshScaricoDraft(); state.scarico.refId = el.getAttribute('data-ref'); state.scarico.lotId = el.getAttribute('data-lot'); state.view = 'scarico'; render(); return; }
      if (action === 'edit-lot'){ openLotModal(el.getAttribute('data-lot')); return; }
      if (action === 'close-lot-modal'){ closeLotModal(); return; }
      if (action === 'save-lot'){ saveLotEdit(); return; }

      if (action === 'save-carico'){ saveCarico(); return; }
      if (action === 'save-scarico'){ saveScarico(); return; }

      if (action === 'prod-add-component'){ prodAddComponent(); return; }
      if (action === 'prod-remove-component'){ prodRemoveComponent(parseInt(el.getAttribute('data-idx'),10)); return; }
      if (action === 'prod-add-alloc'){ prodAddAlloc(parseInt(el.getAttribute('data-comp-idx'),10)); return; }
      if (action === 'prod-remove-alloc'){ prodRemoveAlloc(parseInt(el.getAttribute('data-comp-idx'),10), parseInt(el.getAttribute('data-alloc-idx'),10)); return; }
      if (action === 'save-produzione'){ saveProduzione(); return; }
      if (action === 'open-push'){ openPushModal(el.getAttribute('data-id')); return; }
      if (action === 'close-push-modal'){ closePushModal(); return; }
      if (action === 'confirm-push'){ confirmPush(); return; }
      if (action === 'push-set-mode'){ state.pushModal.mode = el.getAttribute('data-mode'); renderPushModal(); return; }

      if (action === 'new-recipe'){ newRecipe(); return; }
      if (action === 'edit-recipe'){ editRecipe(el.getAttribute('data-id')); return; }
      if (action === 'delete-recipe'){ deleteRecipe(el.getAttribute('data-id')); return; }
      if (action === 'cancel-recipe'){ cancelRecipeForm(); return; }
      if (action === 'save-recipe'){ saveRecipe(); return; }
      if (action === 'recipe-add-component'){ recipeAddComponent(); return; }
      if (action === 'recipe-remove-component'){ recipeRemoveComponent(parseInt(el.getAttribute('data-idx'),10)); return; }

      if (action === 'delete-movement'){ deleteMovement(el.getAttribute('data-id')); return; }
      if (action === 'cancel-confirm'){ closeConfirm(); return; }
      if (action === 'do-confirm'){ var fn = state.confirmModal && state.confirmModal.onConfirm; if (fn) fn(); return; }

      if (action === 'open-settings'){ openSettingsModal(); return; }
      if (action === 'close-settings-modal'){ closeSettingsModal(); return; }
      if (action === 'save-settings'){ saveSettingsModal(); return; }
      if (action === 'remove-fattura-file'){ state.fattura = freshFatturaDraft(); render(); return; }
      if (action === 'analyze-fattura'){ analyzeFattura(); return; }
      if (action === 'close-invoice-modal'){ closeInvoiceReviewModal(); return; }
      if (action === 'confirm-invoice-import'){ confirmInvoiceImport(); return; }
      if (action === 'inv-set-unit'){
        var invIdx = parseInt(el.getAttribute('data-idx'),10);
        state.invoiceReview.lines[invIdx].newRef.unit = el.getAttribute('data-unit');
        withFocusPreserved(renderInvoiceReviewModal);
        return;
      }

      if (el.id === 'refPhotoPicker'){ state.pendingPhotoTarget = 'refModal'; document.getElementById('photoInput').click(); return; }
      if (el.id === 'refPhotoRemove'){ e.stopPropagation(); state.refModal.draft.photo = null; renderRefModal(); return; }
    });

    document.body.addEventListener('change', function(e){
      var t = e.target;
      if (t.id === 'prodRecipe'){ selectRecipeForProduction(t.value); return; }
      if (t.id === 'prodQuantity'){ state.produzione.quantity = t.value; withFocusPreserved(render); return; }
      if (t.id === 'caricoRef'){
        if (t.value === '__new__'){ openRefModal('new', null, 'carico'); t.value = state.carico.refId; return; }
        state.carico = freshCaricoDraft(); state.carico.refId = t.value;
        var ref = referenceById(t.value);
        if (ref){ state.carico.density = ref.density===null||ref.density===undefined?'':ref.density; state.carico.grade = ref.grade===null||ref.grade===undefined?'':ref.grade; }
        render(); return;
      }
      if (t.id === 'caricoLt' || t.id === 'caricoKg'){ handleCaricoBlurAutoDensity(); return; }
      if (t.id === 'lotQtyLt' || t.id === 'lotQtyKg'){ handleLotModalBlurAutoDensity(); return; }
      if (t.id === 'scaricoRef'){ state.scarico = freshScaricoDraft(); state.scarico.refId = t.value; render(); return; }
      if (t.id === 'scaricoLot'){ state.scarico.lotId = t.value; render(); return; }
      if (t.getAttribute && t.getAttribute('data-comp-field') === 'refId'){
        var idx = parseInt(t.getAttribute('data-comp-idx'),10);
        state.produzione.components[idx].refId = t.value;
        state.produzione.components[idx].allocations = [{lotId:'',qty:''}];
        render(); return;
      }
      if (t.getAttribute && t.getAttribute('data-alloc-field') === 'lotId'){
        var ci = parseInt(t.getAttribute('data-comp-idx'),10), ai = parseInt(t.getAttribute('data-alloc-idx'),10);
        state.produzione.components[ci].allocations[ai].lotId = t.value;
        var lot = lotById(t.value);
        var ref = referenceById(state.produzione.components[ci].refId);
        if (lot && ref){
          var recipe = state.produzione.recipeId ? recipeById(state.produzione.recipeId) : null;
          var qtyTot = numOrNull(state.produzione.quantity);
          var required = null;
          if (recipe && qtyTot){
            var factor = qtyTot / recipe.baseLt;
            var c = state.produzione.components[ci];
            required = round((ref.unit==='liquido'?c.doseLt:c.doseKg) * factor, 3);
          }
          var avail = availableQty(lot, ref.unit==='liquido'?'lt':'kg');
          state.produzione.components[ci].allocations[ai].qty = required !== null ? Math.min(required, avail) : '';
        }
        render(); return;
      }
      if (t.getAttribute && t.getAttribute('data-rc-field') === 'refId'){
        var ridx = parseInt(t.getAttribute('data-rc-idx'),10);
        state.ricette.draft.components[ridx].refId = t.value;
        render(); return;
      }
      if (t.id === 'recipeLiquoriProduct'){ state.ricette.draft.liquoriProductId = t.value; return; }
      if (t.id === 'pushProductId'){ state.pushModal.productId = t.value; return; }
      if (t.id === 'pushLocation'){ state.pushModal.location = t.value; return; }
      if (t.id === 'fatturaCameraInput' || t.id === 'fatturaFileInput'){
        var fFile = t.files && t.files[0];
        t.value = '';
        if (fFile) handleFatturaFileSelected(fFile);
        return;
      }
      if (t.id && t.id.indexOf('invRef_') === 0){
        var invIdx1 = parseInt(t.id.slice('invRef_'.length),10);
        var invLine1 = state.invoiceReview.lines[invIdx1];
        if (t.value === '__new__'){
          invLine1.refMode = 'new'; invLine1.refId = '';
        } else {
          invLine1.refMode = 'existing'; invLine1.refId = t.value;
          var matchedRef = referenceById(t.value);
          if (matchedRef){
            invLine1.density = matchedRef.density===null||matchedRef.density===undefined?'':matchedRef.density;
            invLine1.grade = matchedRef.grade===null||matchedRef.grade===undefined?'':matchedRef.grade;
          }
        }
        withFocusPreserved(renderInvoiceReviewModal);
        return;
      }
      if (t.id && (t.id.indexOf('invLt_') === 0 || t.id.indexOf('invKg_') === 0)){
        var invIdx2 = parseInt(t.id.split('_')[1],10);
        handleInvoiceLineBlurAutoDensity(invIdx2);
        return;
      }
      if (t.getAttribute && t.getAttribute('data-action') === 'inv-toggle-include'){
        var invIdx3 = parseInt(t.getAttribute('data-idx'),10);
        state.invoiceReview.lines[invIdx3].include = t.checked;
        withFocusPreserved(renderInvoiceReviewModal);
        return;
      }
      if (t.id === 'photoInput'){
        var file = t.files && t.files[0];
        t.value = '';
        if (!file) return;
        readAndCompressImage(file).then(function(dataUrl){
          if (state.pendingPhotoTarget === 'refModal' && state.refModal){ state.refModal.draft.photo = dataUrl; renderRefModal(); }
        }).catch(function(err){ console.error(err); showToast('Non riesco a leggere questa foto.'); });
        return;
      }
    });

    document.body.addEventListener('input', function(e){
      var t = e.target;
      if (t.id === 'materieSearch'){ state.search = t.value; withFocusPreserved(render); return; }
      if (['caricoLt','caricoKg','caricoDensity','caricoLotto','caricoCausale','caricoGrade'].indexOf(t.id) !== -1){ handleCaricoInput(t); return; }
      if (t.id === 'scaricoCausale'){ state.scarico.causale = t.value; return; }
      if (t.id === 'scaricoLt'){ state.scarico.qtyLt = t.value; return; }
      if (t.id === 'scaricoKg'){ state.scarico.qtyKg = t.value; return; }
      if (t.id === 'prodQuantity'){ state.produzione.quantity = t.value; withFocusPreserved(render); return; }
      if (t.id === 'prodLotto'){ state.produzione.finishedLotto = t.value; return; }
      if (t.id === 'prodGradeEff'){ state.produzione.gradeEffective = t.value; return; }
      if (t.id === 'prodNote'){ state.produzione.note = t.value; return; }
      if (t.getAttribute && t.getAttribute('data-alloc-field') === 'qty'){
        var ci = parseInt(t.getAttribute('data-comp-idx'),10), ai = parseInt(t.getAttribute('data-alloc-idx'),10);
        state.produzione.components[ci].allocations[ai].qty = t.value;
        withFocusPreserved(function(){
          var root = document.getElementById('prodComponentsWrap');
          if (root) root.innerHTML = renderProdComponents();
          var calc = computeProdCalc();
          var boxes = document.querySelectorAll('#viewRoot .readonly-box');
          if (boxes[0]) boxes[0].innerHTML = (calc.anidri===null?'—':fmt(calc.anidri,3)) + '<span class="unit">Lt</span>';
          if (boxes[1]) boxes[1].innerHTML = (calc.gradeTheoretical===null?'—':fmt(calc.gradeTheoretical,2)) + '<span class="unit">%</span>';
        });
        return;
      }
      if (t.id === 'recipeName'){ state.ricette.draft.name = t.value; return; }
      if (t.id === 'recipeBaseLt'){ state.ricette.draft.baseLt = t.value; withFocusPreserved(render); return; }
      if (t.getAttribute && t.getAttribute('data-rc-field') === 'dose'){
        var ridx = parseInt(t.getAttribute('data-rc-idx'),10);
        var ref = referenceById(state.ricette.draft.components[ridx].refId);
        if (ref && ref.unit === 'liquido') state.ricette.draft.components[ridx].doseLt = t.value;
        else state.ricette.draft.components[ridx].doseKg = t.value;
        withFocusPreserved(render); return;
      }
      if (t.id === 'refName'){ state.refModal.draft.name = t.value; return; }
      if (t.id === 'refCodice'){ state.refModal.draft.codice = t.value; return; }
      if (t.id === 'refDensity'){ state.refModal.draft.density = t.value; return; }
      if (t.id === 'refGrade'){ state.refModal.draft.grade = t.value; return; }
      if (t.id === 'refNotes'){ state.refModal.draft.notes = t.value; return; }
      if (t.id === 'lotQtyLt' || t.id === 'lotQtyKg' || t.id === 'lotDensity'){ handleLotModalInput(t); return; }
      if (t.id === 'lotGrade'){ state.lotModal.draft.grade = t.value; return; }
      if (t.id === 'pushNewName'){ state.pushModal.newName = t.value; return; }
      if (t.id === 'pushQty'){ state.pushModal.qty = t.value; return; }
      if (t.id && t.id.indexOf('invLotto_') === 0){
        state.invoiceReview.lines[parseInt(t.id.slice('invLotto_'.length),10)].lotto = t.value; return;
      }
      if (t.id && t.id.indexOf('invNewName_') === 0){
        state.invoiceReview.lines[parseInt(t.id.slice('invNewName_'.length),10)].newRef.name = t.value; return;
      }
      if (t.id && t.id.indexOf('invNewCodice_') === 0){
        state.invoiceReview.lines[parseInt(t.id.slice('invNewCodice_'.length),10)].newRef.codice = t.value; return;
      }
      if (t.id && t.id.indexOf('invGrade_') === 0){
        state.invoiceReview.lines[parseInt(t.id.slice('invGrade_'.length),10)].grade = t.value; return;
      }
      if (t.id && t.id.indexOf('invLt_') === 0){
        handleInvoiceLineQtyInput(parseInt(t.id.slice('invLt_'.length),10), 'lt'); return;
      }
      if (t.id && t.id.indexOf('invKg_') === 0){
        handleInvoiceLineQtyInput(parseInt(t.id.slice('invKg_'.length),10), 'kg'); return;
      }
      if (t.id && t.id.indexOf('invDensity_') === 0){
        handleInvoiceLineQtyInput(parseInt(t.id.slice('invDensity_'.length),10), 'density'); return;
      }
    });

    document.getElementById('storicoBtn').innerHTML = iconClock();
    document.getElementById('storicoBtn').addEventListener('click', function(){
      state.view = state.view === 'storico' ? 'materie' : 'storico';
      document.getElementById('storicoBtn').classList.toggle('active', state.view === 'storico');
      render();
    });

    document.getElementById('settingsBtn').innerHTML = iconSettings();
    document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
  }

  // ==================================================================
  // auth + sync
  // ==================================================================
  function showAuthGate(errorMsg){
    document.getElementById('authGate').hidden = false;
    var errEl = document.getElementById('authError');
    if (errorMsg){ errEl.textContent = errorMsg; errEl.hidden = false; } else { errEl.hidden = true; }
    document.getElementById('signOutBtn').hidden = true;
  }
  function hideAuthGate(){
    document.getElementById('authGate').hidden = true;
    document.getElementById('signOutBtn').hidden = false;
  }
  function authErrorMessage(err){
    var code = err && err.code;
    if (code === 'auth/invalid-email') return 'Email non valida.';
    if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Email o password errati.';
    if (code === 'auth/too-many-requests') return 'Troppi tentativi. Riprova tra qualche minuto.';
    if (code === 'auth/network-request-failed') return 'Problema di connessione. Riprova.';
    return 'Accesso non riuscito. Controlla email e password.';
  }
  function bindAuthForm(){
    document.getElementById('authForm').addEventListener('submit', function(e){
      e.preventDefault();
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      var btn = document.getElementById('authSubmitBtn');
      btn.disabled = true; btn.textContent = 'Accesso in corso…';
      window.__fb.signIn(email, password).catch(function(err){ console.error(err); showAuthGate(authErrorMessage(err)); })
        .finally(function(){ btn.disabled = false; btn.textContent = 'Accedi'; });
    });
    document.getElementById('signOutBtn').innerHTML = iconLogout();
    document.getElementById('signOutBtn').addEventListener('click', function(){ window.__fb.signOut(); });
  }

  var syncStarted = false;
  function initAuth(){
    window.__fb.onAuthState(function(user){
      if (user){ hideAuthGate(); if (!syncStarted){ syncStarted = true; startSync(); } }
      else { showAuthGate(); }
    });
  }

  function startSync(){
    window.__fb.onCollectionSnapshot(REFS_COLL, function(docs, err){
      if (err){ setSyncStatus('error'); return; }
      state.references = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      setSyncStatus('synced'); render();
    });
    window.__fb.onCollectionSnapshot(LOTS_COLL, function(docs, err){
      if (err) return;
      state.lots = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onCollectionSnapshot(RECIPES_COLL, function(docs, err){
      if (err) return;
      state.recipes = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onCollectionSnapshot(PRODUCTIONS_COLL, function(docs, err){
      if (err) return;
      state.productions = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onDocSnapshot(MOVES_DOC, function(data, err){
      if (err) return;
      state.movements = (data && data.entries) ? data.entries : [];
      if (state.view === 'storico') render();
    });
    window.__fb.onCollectionSnapshot(LIQ_PRODUCTS_COLL, function(docs, err){
      if (err) return;
      state.liquoriProducts = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
    });
    window.__fb.onDocSnapshot(LIQ_MOVES_DOC, function(data, err){
      if (err) return;
      state.liquoriMovements = (data && data.entries) ? data.entries : [];
    });
    LOCATIONS.forEach(function(loc){
      window.__fb.onDocSnapshot('stock_liquori/' + loc.id, function(data, err){
        if (err) return;
        state.liquoriStock[loc.id] = data || {};
      });
    });
  }

  function whenFirebaseReady(cb){
    if (window.__fb) cb();
    else window.addEventListener('fb-ready', cb, { once:true });
  }

  bindGlobalEvents();
  bindAuthForm();
  render();
  whenFirebaseReady(initAuth);
})();
</script>
</body>
</html>
