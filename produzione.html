      render();
    }).catch(function(e){
      console.error(e);
      showToast('Salvataggio non riuscito. Controlla le giacenze e riprova.');
    });
  }

  // ==================================================================
  // VIEW: Produzione (prodotto finito -> componenti -> scarico automatico)
  // ==================================================================
  function suggestLotto(){
    var base = 'PF-' + todayStr() + '-';
    var n = state.productions.filter(function(p){ return (p.finishedLotto || '').indexOf(base) === 0; }).length + 1;
    return base + String(n).padStart(2, '0');
  }
  function prodRequired(c){
    var d = state.produzione, ref = referenceById(c.refId);
    if (!ref) return null;
    var recipe = d.recipeId ? recipeById(d.recipeId) : null;
    if (recipe){
      var qty = numOrNull(d.quantity);
      if (!qty || !recipe.baseLt) return null;
      var dose = ref.unit === 'liquido' ? c.doseLt : c.doseKg;
      if (dose === null || dose === undefined) return null;
      return round(dose * qty / recipe.baseLt, 3);
    }
    return numOrNull(c.req);
  }
  // Scarico automatico: preleva dai lotti con scadenza più vicina (FEFO) fino a coprire il fabbisogno.
  function autoAllocate(c){
    var ref = referenceById(c.refId);
    c.allocations = [];
    if (!ref) return;
    var req = prodRequired(c);
    if (!req || req <= 0) return;
    var unit = ref.unit === 'liquido' ? 'lt' : 'kg';
    var left = req;
    lotsByExpiry(ref.id).forEach(function(l){
      if (left <= 0.0005) return;
      if (expiryStatus(l.scadenza).cls === 'expired') return; // i lotti scaduti non si usano in automatico
      var av = availableQty(l, unit);
      if (av <= 0.0005) return;
      var take = round(Math.min(av, left), 3);
      c.allocations.push({ lotId:l.id, qty:take });
      left = round(left - take, 3);
    });
  }
  function autoAllocateAll(){ state.produzione.components.forEach(autoAllocate); }
  function allocTotal(c){ return round((c.allocations || []).reduce(function(s, a){ return s + (numOrNull(a.qty) || 0); }, 0), 3); }

        var um = ref ? refUm(ref) : null;
        var alt = (um && req !== null && um.id !== (ref.unit === 'liquido' ? 'lt' : 'kg')) ? ' <span class="hint">(' + fmt(req / um.factor, 3) + ' ' + escapeHtml(um.label) + ')</span>' : '';
        html += '<td class="ro">' + (req !== null ? fmt(req, 3) + ' ' + unitLbl + alt : '—') + '</td>';
      } else {

        html += '<td><input type="number" step="any" min="0" data-pc="' + i + '" data-pf="req" value="' + escapeHtml(c.req) + '" placeholder="' + (unitLbl || 'Lt / Kg') + '" style="width:7rem"' + (ref ? '' : ' disabled') + '> ' + unitLbl + '</td>';
      }
      html += '<td>';
      (c.allocations || []).forEach(function(a, j){
        var lots = ref ? lotsByExpiry(ref.id) : [];
        html += '<div style="display:flex;gap:.3rem;margin-bottom:.25rem;align-items:center"><select data-pc="' + i + '" data-pa="' + j + '" data-pf="alot" style="flex:1;min-width:13rem">';
        lots.forEach(function(l){
          var av = ref && ref.unit === 'liquido' ? l.qtyLt : l.qtyKg;
          var e = expiryStatus(l.scadenza);
          html += '<option value="' + l.id + '"' + (l.id === a.lotId ? ' selected' : '') + '>Lotto ' + escapeHtml(l.lotto) + ' — disp. ' + fmt(av, 3) + (e.label ? ' — ' + e.label : '') + '</option>';
        });
        html += '</select><input type="number" step="any" min="0" data-pc="' + i + '" data-pa="' + j + '" data-pf="aqty" value="' + escapeHtml(a.qty) + '" style="width:6.5rem"><span class="hint">' + unitLbl + '</span><button type="button" class="x-btn" data-action="prod-remove-alloc" data-comp-idx="' + i + '" data-alloc-idx="' + j + '" title="Togli lotto">×</button></div>';
      });
      if (ref) html += '<button type="button" class="btn btn-sm btn-ghost" data-action="prod-add-alloc" data-comp-idx="' + i + '">+ lotto</button> <button type="button" class="btn btn-sm btn-ghost" data-action="prod-realloc" data-comp-idx="' + i + '">Ricalcola</button>';
      html += '</td>';
      html += '<td class="ro" data-cover="' + i + '">' + prodCoverText(c) + '</td>';
      html += '<td>' + (recipe ? '' : '<button type="button" class="x-btn" data-action="prod-remove-component" data-idx="' + i + '" title="Rimuovi">×</button>') + '</td></tr>';
    });
    if (!d.components.length) html += '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:1.4rem">' + (recipe ? 'Il prodotto non ha componenti.' : 'Scegli un prodotto finito: le componenti e lo scarico dai lotti si compilano da soli. Oppure aggiungi componenti a mano (produzione libera).') + '</td></tr>';
    return html;
  }
  function prodCoverText(c){
    var ref = c.refId ? referenceById(c.refId) : null;
    if (!ref) return '—';
    var req = prodRequired(c), tot = allocTotal(c), u = ref.unit === 'liquido' ? 'Lt' : 'Kg';
    if (req === null || req <= 0) return tot > 0 ? fmt(tot, 3) + ' ' + u : '—';
    var diff = round(req - tot, 3);
    if (Math.abs(diff) < 0.001) return '<span class="alloc-ok">✓ coperto</span>';
    if (diff > 0) return '<span class="alloc-bad">Mancano ' + fmt(diff, 3) + ' ' + u + '</span>';
    return '<span class="alloc-bad">+' + fmt(-diff, 3) + ' ' + u + ' in eccesso</span>';
  }
  function computeProdCalc(){
    var d = state.produzione;
    var qty = numOrNull(d.quantity);
    var anidri = 0, hasAny = false;
    d.components.forEach(function(c){
      var ref = referenceById(c.refId);
      if (!ref || ref.unit !== 'liquido') return;
      (c.allocations || []).forEach(function(a){
        var lot = lotById(a.lotId), q = numOrNull(a.qty);
        if (!lot || q === null) return;
        if (lot.grade !== null && lot.grade !== undefined){ anidri += q * lot.grade / 100; hasAny = true; }
      });
    });
    anidri = hasAny ? round(anidri, 3) : null;
    return { anidri: anidri, gradeTheoretical: (anidri !== null && qty) ? round(anidri / qty * 100, 2) : null };
  }
  function prodTotalsText(){
    var calc = computeProdCalc();
    return 'Litri anidri: <b>' + (calc.anidri === null ? '—' : fmt(calc.anidri, 3) + ' Lt') + '</b> · Gradazione teorica: <b>' + (calc.gradeTheoretical === null ? '—' : fmt(calc.gradeTheoretical, 2) + '%') + '</b>';
  }

  function prodAddAlloc(ci){

    var used = (c.allocations || []).map(function(a){ return a.lotId; });
    var next = ref ? lotsByExpiry(ref.id).filter(function(l){ return used.indexOf(l.id) === -1; })[0] : null;

  function saveProduzione(){
    var d = state.produzione;
    var quantity = numOrNull(d.quantity);
    var finishedLotto = (d.finishedLotto || '').trim();
    var gradeEffective = numOrNull(d.gradeEffective);
    var note = (d.note || '').trim();

    if (!finishedLotto){ showToast('Inserisci il lotto del prodotto finito.'); return; }
    if (!quantity || quantity <= 0){ showToast('Inserisci i litri da produrre.'); return; }
    if (!d.components.length){ showToast('Scegli un prodotto finito o aggiungi almeno un componente.'); return; }

    var consumptions = [], shortages = [], used = {};
    for (var i = 0; i < d.components.length; i++){
      var c = d.components[i];
      var ref = referenceById(c.refId);
      if (!ref){ showToast('Riga ' + (i + 1) + ': scegli la materia prima.'); return; }
      var unit = ref.unit === 'liquido' ? 'lt' : 'kg';
      var tot = 0;
      for (var j = 0; j < c.allocations.length; j++){
        var a = c.allocations[j];
        var q = numOrNull(a.qty);
        if (!a.lotId || !q || q <= 0) continue;
        var lot = lotById(a.lotId);
        if (!lot){ showToast('Lotto non valido per ' + ref.name + '.'); return; }
        used[lot.id] = (used[lot.id] || 0) + q;
        var avail = availableQty(lot, unit);
        if (used[lot.id] > avail + 0.0005){
          showToast('Disponibili solo ' + fmt(avail, 3) + ' ' + (unit === 'lt' ? 'Lt' : 'Kg') + ' nel lotto ' + lot.lotto + ' di ' + ref.name + '.');
          return;
        }
        tot += q;
        consumptions.push({ lot: lot, qty: q, unit: unit, refName: ref.name, refCodice: ref.codice || null });
      }
      var req = prodRequired(c);
      if (req !== null && req > 0 && tot < req - 0.001) shortages.push(ref.name + ' (mancano ' + fmt(req - tot, 3) + ' ' + (unit === 'lt' ? 'Lt' : 'Kg') + ')');
      if (!(req > 0) && tot <= 0) shortages.push(ref.name + ' (nessuna quantità)');
    }
    if (!consumptions.length){ showToast('Non c\'è nessuna quantità da scaricare: controlla le giacenze.'); return; }
    if (shortages.length){
      openConfirm('Componenti non coperti', 'Giacenza insufficiente per: ' + shortages.join('; ') + '. Registrare comunque la produzione con quanto disponibile?', function(){ closeConfirm(); doProduzione(consumptions, finishedLotto, quantity, gradeEffective, note); });
      return;
    }
    doProduzione(consumptions, finishedLotto, quantity, gradeEffective, note);
  }

  function doProduzione(consumptions, finishedLotto, quantity, gradeEffective, note){
    var d = state.produzione;
    var calc = computeProdCalc();
    var productionId = uid('prod');
    var componentsSnapshot = [];
    var chain = Promise.resolve();
    consumptions.forEach(function(cons){
      chain = chain.then(function(){
        var updated = consumeFromLot(cons.lot, cons.qty, cons.unit);
        cons.lot.qtyLt = updated.qtyLt;
        cons.lot.qtyKg = updated.qtyKg;
        return window.__fb.setDoc(LOTS_COLL + '/' + cons.lot.id, { qtyLt: updated.qtyLt, qtyKg: updated.qtyKg, updatedAt: new Date().toISOString() }, true).then(function(){
          logProdMovement({ type:'scarico_produzione', refId: cons.lot.refId, refName: cons.refName, lotto: cons.lot.lotto, unit: cons.unit, delta: -cons.qty, causale: 'Produzione lotto ' + finishedLotto });
          componentsSnapshot.push({ refId: cons.lot.refId, refName: cons.refName, refCodice: cons.refCodice, lotto: cons.lot.lotto, scadenza: cons.lot.scadenza || null, qty: cons.qty, unit: cons.unit });
        });
      });
    });
    chain.then(function(){
      var recipe = d.recipeId ? recipeById(d.recipeId) : null;
      var prodDoc = {
        recipeId: d.recipeId || null,
        recipeName: recipe ? recipe.name : null,
        quantityLt: quantity,
        finishedLotto: finishedLotto,
        gradeTheoretical: calc.gradeTheoretical,
        gradeEffective: gradeEffective,
        anhydrousLt: calc.anidri,
        components: componentsSnapshot,
        note: note || null,
        createdAt: new Date().toISOString(),
        pushes: []
      };
      return window.__fb.setDoc(PRODUCTIONS_COLL + '/' + productionId, prodDoc).then(function(){
        state.productions.push(Object.assign({ id: productionId }, prodDoc));
      });
    }).then(function(){
      showToast('Produzione registrata e componenti scaricati: lotto ' + finishedLotto + '.');
      state.produzione = freshProduzioneDraft();
      state.view = 'scheda';
      state.schedaProductionId = productionId;
      render();
    }).catch(function(e){
      console.error(e);
      showToast('Si è verificato un errore durante il salvataggio della produzione. Controlla le giacenze.');
    });
  }

  function onClickNew(e){
    var t = e.target;
    if (t.closest('.col-resize')) return true;
    if (state.menuOpen && !t.closest('.menu')){ state.menuOpen = null; renderMenus(); }
    var rowEl = t.closest('tr[data-grow]');
    if (rowEl && !t.closest('button,a,input,select,label,textarea')){
      selectRow(rowEl.getAttribute('data-grid'), rowEl.getAttribute('data-grow'), true);
      return true;
    }
    var el = t.closest('[data-action]');
    if (!el) return false;
    var a = el.getAttribute('data-action');
    var gid = el.getAttribute('data-grid');
    var idx = parseInt(el.getAttribute('data-idx'), 10);

    if (a === 'tab'){ gotoView(el.getAttribute('data-tab')); return true; }

        var at = order.indexOf(cid);

        if (i0 !== -1 && i1 >= 0 && i1 < order.length){ var tmp = order[i0]; order[i0] = order[i1]; order[i1] = tmp; }
      } else order = null;
      var cp = {}; cp[g2] = a === 'col-reset' ? { cols:null, widths:null } : { cols:order };
      saveConfig({ grids: cp });

    if (a === 'scarico-del-row'){ state.scarico.rows.splice(idx, 1); if (!state.scarico.rows.length) state.scarico.rows.push(freshScaricoRow()); render(); return true; }

    if (t.hasAttribute('data-cfield')){

      if (f === 'refId'){
        if (t.value === '__new__'){ var prev = state.carico.rows[ci].refId; t.value = prev; openRefModal('new', null, 'carico', ci); return true; }
        state.carico.rows[ci].lt = ''; state.carico.rows[ci].kg = ''; state.carico.rows[ci].qty = '';
        setCaricoRef(state.carico.rows[ci], t.value);

      }

    if (t.hasAttribute('data-sfield')){

      var si = parseInt(t.getAttribute('data-srow'), 10);

    if (t.hasAttribute('data-pf')){

      if (!c) return true;
      if (f === 'ref'){ c.refId = t.value; c.req = ''; c.allocations = []; refreshProdComps(); return true; }
      if (f === 'req'){ c.req = t.value; autoAllocate(c); refreshProdComps(); return true; }
      var al = c.allocations[parseInt(t.getAttribute('data-pa'), 10)];
      if (f === 'alot'){ if (al) al.lotId = t.value; refreshProdComps(); return true; }
      if (f === 'aqty'){ if (al) al.qty = t.value; refreshProdComps(); return true; }
      return true;
    }
    if (t.hasAttribute('data-rc-field')){
      var rc = state.ricette.draft.components[parseInt(t.getAttribute('data-rc-idx'), 10)];
      f = t.getAttribute('data-rc-field');
      if (!rc) return true;
      if (f === 'refId'){ rc.refId = t.value; rc.um = ''; var rf = referenceById(t.value); if (rf) rc.um = refUm(rf).id; render(); return true; }
      if (f === 'um'){ rc.um = t.value; render(); return true; }
      return true;
    }
    return false;
  }

  function newInView(){
    var v = state.view;
    if (v === 'materie') openRefModal('new', null, null);
    else if (v === 'prodotti'){ if (state.ricette.formOpen) recipeAddComponent(); else newRecipe(); }
    else if (v === 'produzioni') gotoView('produzione');
    else if (v === 'carico'){ state.carico.rows.push(freshCaricoRow()); render(); }

  }

  function onKeyNew(e){
    if (e.key === 'Escape'){
      if (state.menuOpen){ state.menuOpen = null; renderMenus(); return; }
      closeTopModal(); return;
    }
    if (e.altKey && /^Digit[1-9]$/.test(e.code)){
      var v = VIEWS[parseInt(e.code.slice(5), 10) - 1];
      if (v){ e.preventDefault(); gotoView(v.id); }
      return;
    }
    if (e.key === 'F1'){ e.preventDefault(); openTool('help'); return; }
    if (anyModalOpen()) return;
    if (e.ctrlKey && e.key === 'Enter'){
      e.preventDefault();
      if (state.view === 'carico') saveCarico();
      else if (state.view === 'scarico') saveScarico();
      else if (state.view === 'produzione') saveProduzione();
      else if (state.view === 'prodotti' && state.ricette.formOpen) saveRecipe();
      return;
    }
    var gid = currentGrid();
    if (e.key === 'F3'){
      var s = document.querySelector('[data-gsearch]');
      if (s){ e.preventDefault(); s.focus(); s.select(); }
      return;
    }
    if (e.key === 'F4'){ e.preventDefault(); newInView(); return; }
    if (e.key === 'F2' && gid && state.sel[gid]){ e.preventDefault(); activateRow(gid, state.sel[gid]); return; }
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag) || !gid) return;
    var ids = gridOrder[gid] || [];
    var at = ids.indexOf(state.sel[gid]);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!ids.length) return;
      var nx = e.key === 'ArrowDown' ? Math.min(ids.length - 1, at + 1) : Math.max(0, at === -1 ? 0 : at - 1);
      selectRow(gid, ids[nx], false);
    } else if (e.key === 'Enter' && state.sel[gid]){ e.preventDefault(); activateRow(gid, state.sel[gid]); }
    else if (e.key === 'Delete' && state.sel[gid]){
      if (gid === 'materie') deleteReference(state.sel[gid]);
      else if (gid === 'prodotti') deleteRecipe(state.sel[gid]);
      else if (gid === 'storico') deleteMovement(state.sel[gid]);
    }
  }

  function bindGridResize(){
    document.addEventListener('pointerdown', function(e){
      var h = e.target.closest ? e.target.closest('.col-resize') : null;
      if (!h) return;
      e.preventDefault(); e.stopPropagation();
      var gid = h.getAttribute('data-grid'), colId = h.getAttribute('data-resize');
      var table = document.querySelector('table.grid[data-grid="' + gid + '"]');
      var colEl = table && table.querySelector('col[data-col="' + colId + '"]');
      if (!colEl) return;
      var startX = e.clientX, startW = colEl.offsetWidth, startTW = table.offsetWidth, w = startW;
      function mv(ev){ w = Math.max(50, Math.round(startW + ev.clientX - startX)); colEl.style.width = w + 'px'; table.style.width = (startTW + w - startW) + 'px'; }
      function up(){
        document.removeEventListener('pointermove', mv);
        document.removeEventListener('pointerup', up);
        var ws = {}; ws[colId] = w;
        var p = {}; p[gid] = { widths: ws };
        saveConfig({ grids: p });
      }
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
    });
  }

  function authErrorMessage(err){
    var code = err && err.code;
    if (code === 'auth/invalid-email') return 'Email non valida.';
    if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Email o password errati.';
    if (code === 'auth/too-many-requests') return 'Troppi tentativi. Riprova tra qualche minuto.';
    if (code === 'auth/network-request-failed') return 'Problema di connessione. Riprova.';
    return 'Accesso non riuscito. Controlla email e password.';
  }
  function bindAuthForm(){
    document.getElementById('authForm').addEventListener('submit', function(e){
      e.preventDefault();
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      var btn = document.getElementById('authSubmitBtn');
      btn.disabled = true; btn.textContent = 'Accesso in corso…';
      window.__fb.signIn(email, password).catch(function(err){ console.error(err); showAuthGate(authErrorMessage(err)); })
        .finally(function(){ btn.disabled = false; btn.textContent = 'Accedi'; });
    });
    document.getElementById('signOutBtn').innerHTML = iconLogout();
    document.getElementById('signOutBtn').addEventListener('click', function(){ window.__fb.signOut(); });
  }

  var syncStarted = false;
  function initAuth(){
    window.__fb.onAuthState(function(user){
      if (user){ hideAuthGate(); if (!syncStarted){ syncStarted = true; startSync(); } }
      else { showAuthGate(); }
    });
  }

  function startSync(){
    window.__fb.onDocSnapshot(CONFIG_DOC, function(data, err){
      if (err || cfgTimer || cfgPending) return;
      var c = freshConfig();
      if (data) mergeInto(c, data);
      state.config = c;
      render();
    });
    window.__fb.onCollectionSnapshot(REFS_COLL, function(docs, err){
      if (err){ setSyncStatus('error'); return; }
      state.references = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      setSyncStatus('synced'); render();
    });
    window.__fb.onCollectionSnapshot(LOTS_COLL, function(docs, err){
      if (err) return;
      state.lots = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onCollectionSnapshot(RECIPES_COLL, function(docs, err){
      if (err) return;
      state.recipes = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onCollectionSnapshot(PRODUCTIONS_COLL, function(docs, err){
      if (err) return;
      state.productions = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
      render();
    });
    window.__fb.onDocSnapshot(MOVES_DOC, function(data, err){
      if (err) return;
      state.movements = (data && data.entries) ? data.entries : [];
      if (state.view === 'storico') render();
    });
    window.__fb.onCollectionSnapshot(LIQ_PRODUCTS_COLL, function(docs, err){
      if (err) return;
      state.liquoriProducts = docs.map(function(d){ var o = { id: d.id }; Object.keys(d.data).forEach(function(k){ o[k]=d.data[k]; }); return o; });
    });
    window.__fb.onDocSnapshot(LIQ_MOVES_DOC, function(data, err){
      if (err) return;
      state.liquoriMovements = (data && data.entries) ? data.entries : [];
    });
    LOCATIONS.forEach(function(loc){
      window.__fb.onDocSnapshot('stock_liquori/' + loc.id, function(data, err){
        if (err) return;
        state.liquoriStock[loc.id] = data || {};
      });
    });
  }

  function whenFirebaseReady(cb){
    if (window.__fb) cb();
    else window.addEventListener('fb-ready', cb, { once:true });
  }

  bindGlobalEvents();
  bindAuthForm();
  render();
  whenFirebaseReady(initAuth);
})();
</script>
</body>
</html>
